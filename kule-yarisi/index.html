<title>Kule Yarışı</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kule Yarışı">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=swap">
<style>
  /* Tek ekran oyun: tam ekran canvas; menü canvas'ın üstünde ortalanmış kart. Bilerek tek (koyu) tema. */
  :root {
    --bg: #0d1018;
    --panel: rgba(16, 19, 28, 0.92);
    --panel-line: rgba(255, 255, 255, 0.09);
    --fg: #f3efe7;
    --muted: #a3a9b8;
    --crane: #f4b400;
    --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --font-ui: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Barlow", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; height: 100%; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }

  #menu {
    position: absolute; inset: 0;
    display: flex;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(180deg, rgba(8, 10, 16, 0.2), rgba(8, 10, 16, 0.72));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .card {
    width: 100%; max-width: 460px;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 20px 18px 18px;
    display: grid; gap: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .brand { display: grid; gap: 4px; }
  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(30px, 9vw, 42px);
    line-height: 0.95;
    text-wrap: balance;
  }
  .brand h1 span { color: var(--crane); }
  .brand p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
  .group { display: grid; gap: 8px; }
  .group h2 {
    margin: 0;
    font-family: var(--font-ui); font-weight: 700; font-size: 13px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .opt {
    appearance: none; text-align: left;
    border: 1px solid var(--panel-line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--fg);
    border-radius: 10px;
    padding: 10px 12px;
    min-height: 44px;
    display: grid; gap: 2px; align-content: start;
    cursor: pointer; min-width: 0; font: inherit;
  }
  .opt b { font-family: var(--font-ui); font-weight: 800; font-size: 19px; letter-spacing: 0.02em; text-transform: uppercase; }
  .opt small { color: var(--muted); font-size: 13px; line-height: 1.25; }
  .opt[aria-pressed="true"] { border-color: var(--crane); background: rgba(244, 180, 0, 0.12); }
  .opt[aria-pressed="true"] b { color: var(--crane); }
  .opt[disabled] { opacity: 0.45; cursor: not-allowed; }
  .opt:focus-visible, .btn:focus-visible, #menuBtn:focus-visible, input:focus-visible { outline: 2px solid var(--crane); outline-offset: 2px; }

  .online { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--panel-line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { min-width: 0; }
  .online input {
    flex: 1 1 110px;
    font-family: var(--font-ui); font-weight: 800; font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase;
    background: rgba(0, 0, 0, 0.35); color: var(--fg);
    border: 1px solid var(--panel-line); border-radius: 8px; padding: 8px 10px; min-height: 44px; box-sizing: border-box;
  }
  .btn {
    appearance: none; cursor: pointer;
    font-family: var(--font-ui); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; font-size: 17px;
    border-radius: 8px; padding: 10px 14px; min-height: 44px;
    border: 1px solid var(--panel-line);
    background: rgba(255, 255, 255, 0.07); color: var(--fg);
  }
  .btn.primary {
    background: var(--crane); color: #1b1400; border-color: transparent;
    font-size: 24px; padding: 14px; width: 100%;
    font-family: var(--font-display); letter-spacing: 0.04em;
  }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .status { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
  .code { font-family: var(--font-ui); font-weight: 800; font-size: 30px; letter-spacing: 0.25em; color: var(--crane); }
  .link { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
  .foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .foot span { font-variant-numeric: tabular-nums; }

  #menuBtn {
    position: absolute;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(13, 16, 24, 0.85); color: var(--fg);
    font-family: var(--font-ui); font-weight: 800; font-size: 13px; letter-spacing: 0.04em;
    cursor: pointer; z-index: 5;
    display: grid; place-items: center;
  }
  @media (prefers-reduced-motion: reduce) { .card { backdrop-filter: none; -webkit-backdrop-filter: none; } }
</style>

<div id="stage">
  <canvas id="c" aria-label="Kule Yarışı oyun alanı"></canvas>
  <button id="menuBtn" type="button" aria-label="Menüye dön" hidden>MENÜ</button>

  <div id="menu">
    <div class="card" role="dialog" aria-labelledby="ttl">
      <div class="brand">
        <h1 id="ttl">KULE <span>YARIŞI</span></h1>
        <p>Vinç bloğu sallıyor. Doğru anda dokun, blok düşsün ve kulenin tam üstüne otursun.</p>
      </div>

      <div class="group">
        <h2>Kim oynuyor?</h2>
        <div class="seg" data-group="layout">
          <button class="opt" type="button" id="opt-single" data-value="single"><b>Tek kişi</b><small>Rekorunu kır</small></button>
          <button class="opt" type="button" id="opt-online" data-value="online"><b>Online</b><small>İki ayrı telefon</small></button>
        </div>
      </div>

      <div class="online" id="onlineBox" hidden>
        <div class="row">
          <button class="btn" type="button" id="mkRoom">Oda kur</button>
          <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="4" placeholder="KOD" aria-label="Oda kodu">
          <button class="btn" type="button" id="joinRoom">Katıl</button>
        </div>
        <p class="status" id="roomStatus">Bir oda kur ve kodu arkadaşına söyle, ya da onun kodunu yazıp katıl.</p>
        <div class="row" id="shareRow" hidden>
          <button class="btn" type="button" id="shareBtn">Davet linki gönder</button>
          <span class="link" id="shareUrl"></span>
        </div>
        <button class="btn" type="button" id="leaveRoom" hidden>Odadan çık</button>
      </div>

      <div class="group">
        <h2>Oyun</h2>
        <div class="seg" data-group="mode">
          <button class="opt" type="button" id="opt-classic" data-value="classic"><b>Klasik</b><small>3 can, kule bitene kadar</small></button>
          <button class="opt" type="button" id="opt-timed" data-value="timed"><b>60 Saniye</b><small>Süre bitince en çok puan</small></button>
        </div>
      </div>

      <div class="group">
        <h2>Ses</h2>
        <div class="seg">
          <button class="opt" type="button" id="sfxBtn"><b>Efektler</b><small id="sfxLbl">Açık</small></button>
          <button class="opt" type="button" id="musicBtn"><b>Müzik</b><small id="musicLbl">Açık</small></button>
        </div>
      </div>

      <button class="btn primary" type="button" id="play">OYNA</button>

      <div class="foot">
        <span id="recordLine">Rekor: —</span>
        <span>Online: 5 kusursuz üst üste = saldırı</span>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =====================================================================
  //  Sabitler (oyun dünyası birimleri: x = görünüm genişliği oranı, y = kat)
  // =====================================================================
  const BHW = 0.1;           // bir katın yüksekliği, genişlik biriminde
  const BW = 0.3;            // blok genişliği
  const BASE_W = 0.42;       // temel genişliği
  const ROPE = 4.2;          // ip uzunluğu (kat)
  const DROP_H = 2.0;        // asılı bloğun altı ile kule tepesi arası (kat, açı 0'da)
  const G = 20;              // yerçekimi (kat/s²) → 2 kat düşüş ≈ 0,45 s
  const PERFECT = 0.1;       // kusursuz: blok genişliğinin %10'u
  const STEP = 1 / 120;      // sabit fizik adımı
  const ATTACK_EVERY = 5;
  const TIMED_SECONDS = 60;
  const LIVES = 3;
  const FLOOR_M = 3.2;
  const PLANE_FLOORS = [3, 7, 12, 18, 24, 31, 40, 52];
  const DISP = '"Archivo Black", "Arial Black", Impact, sans-serif';
  const COND = '"Barlow Condensed", "Arial Narrow", sans-serif';
  const IN_CLAUDE = !!(window.claude && window.claude.use);

  const $ = s => document.querySelector(s);
  const cv = $("#c");
  const ctx = cv.getContext("2d", { alpha: false });

  let W = 1, H = 1, DPR = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    placeMenuBtn();
  }
  window.addEventListener("resize", resize);

  // =====================================================================
  //  Yardımcılar
  // =====================================================================
  function hash(a, b) {
    let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h | 0; }
  function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function css(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
  function ramp(stops, t) {
    t = clamp(t, 0, 1);
    for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { const a = stops[i - 1], b = stops[i]; return mixRGB(a[1], b[1], (t - a[0]) / (b[0] - a[0])); }
    return stops[stops.length - 1][1];
  }
  const meters = n => (n * FLOOR_M).toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtScore = n => n.toLocaleString("tr-TR");
  function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
  function hazard(x, y, w, h, a, b) {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = a; ctx.fillRect(x, y, w, h); ctx.fillStyle = b;
    const s = Math.max(4, h * 1.4);
    for (let i = -h * 2; i < w + h * 2; i += s * 2) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + s, y + h); ctx.lineTo(x + i + s + h, y); ctx.lineTo(x + i + h, y); ctx.fill(); }
    ctx.restore();
  }
  function txt(str, x, y, size, color, o) {
    o = o || {};
    ctx.globalAlpha = o.a == null ? 1 : clamp(o.a, 0, 1);
    ctx.font = (o.w || "800") + " " + size + "px " + (o.f || COND);
    ctx.textAlign = o.align || "center"; ctx.textBaseline = o.base || "middle";
    if ("letterSpacing" in ctx) ctx.letterSpacing = o.ls || "0px";
    if (o.stroke) { ctx.lineJoin = "round"; ctx.lineWidth = o.stroke; ctx.strokeStyle = "rgba(8,10,18,0.75)"; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
    ctx.globalAlpha = 1;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  }
  function fit(str, maxW, size, f, w) {
    ctx.font = (w || "800") + " " + size + "px " + (f || COND);
    const m = ctx.measureText(str).width;
    return m > maxW ? Math.max(9, Math.floor(size * maxW / m)) : size;
  }
  function heart(x, y, s, fill) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    ctx.fillStyle = fill; ctx.fill();
  }

  // =====================================================================
  //  Kalıcı tercihler (yalnız bu tarayıcı)
  // =====================================================================
  const store = {
    get(k, d) { try { const v = localStorage.getItem("kule-" + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("kule-" + k, String(v)); } catch (e) {} },
  };
  const cfg = {
    mode: store.get("mode", "classic") === "timed" ? "timed" : "classic",
    layout: ["single", "online"].includes(store.get("layout", "single")) ? store.get("layout", "single") : "single",
  };
  const recKey = () => "best-" + cfg.mode;
  function best() { return parseInt(store.get(recKey(), "0"), 10) || 0; }
  function saveBest(score) { if (score > best()) { store.set(recKey(), score); return true; } return false; }

  // =====================================================================
  //  Ses motoru (Web Audio, dosyasız: tüm sesler kodla üretilir)
  // =====================================================================
  const AU = {
    ctx: null, master: null, sfx: null, mus: null, noise: null, windGain: null, windFilt: null, timer: null,
    sfxOn: store.get("sfx", "1") === "1", musicOn: store.get("music", "1") === "1",
    SFX_VOL: 0.45, MUS_VOL: 0.085, level: 0,
  };
  function auInit() {
    if (AU.ctx) { if (AU.ctx.state === "suspended") AU.ctx.resume().catch(() => {}); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      AU.ctx = new C({ latencyHint: "interactive" });
    } catch (e) { AU.ctx = null; return; }
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    const c = AU.ctx;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    comp.connect(c.destination);
    AU.master = c.createGain(); AU.master.gain.value = 0.9; AU.master.connect(comp);
    AU.sfx = c.createGain(); AU.sfx.gain.value = AU.sfxOn ? AU.SFX_VOL : 0; AU.sfx.connect(AU.master);
    AU.mus = c.createGain(); AU.mus.gain.value = AU.musicOn ? AU.MUS_VOL : 0; AU.mus.connect(AU.master);
    const buf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = buf;
    // rüzgâr ambiyansı: döngülü filtreli gürültü
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    AU.windFilt = c.createBiquadFilter(); AU.windFilt.type = "bandpass"; AU.windFilt.frequency.value = 500; AU.windFilt.Q.value = 0.6;
    AU.windGain = c.createGain(); AU.windGain.gain.value = 0;
    src.connect(AU.windFilt).connect(AU.windGain).connect(AU.sfx);
    src.start();
    if (c.state === "suspended") c.resume().catch(() => {});
    MUS.next = c.currentTime + 0.15;
    AU.timer = setInterval(musicSchedule, 90);
  }
  const auOK = () => AU.ctx && AU.ctx.state === "running";
  const now = () => AU.ctx.currentTime;
  const vary = (v, pct) => v * (1 + (Math.random() * 2 - 1) * pct);
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function osc(type, f, t, dur, peak, dest, a, slide) {
    const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
    a = a || 0.005;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + a + dur);
    env(g, t, a, peak, dur);
    o.connect(g).connect(dest || AU.sfx);
    o.start(t); o.stop(t + a + dur + 0.05);
  }
  function noise(t, dur, peak, ftype, freq, q, dest, a, freqEnd) {
    const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    a = a || 0.002;
    s.buffer = AU.noise;
    f.type = ftype; f.frequency.setValueAtTime(freq, t);
    if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + a + dur);
    f.Q.value = q || 0.7;
    env(g, t, a, peak, dur);
    s.connect(f).connect(g).connect(dest || AU.sfx);
    s.start(t, Math.random() * 0.4); s.stop(t + a + dur + 0.05);
  }
  function duck(amount, hold) {
    if (!AU.ctx || !AU.musicOn) return;
    const t = now(), g = AU.mus.gain;
    g.cancelScheduledValues(t);
    g.setTargetAtTime(AU.MUS_VOL * amount, t, 0.02);
    g.setTargetAtTime(AU.MUS_VOL, t + (hold || 0.25), 0.18);
  }
  function bell(f, t, v) {
    v = v || 1;
    osc("sine", f, t, 0.9, 0.32 * v, null, 0.004);
    osc("sine", f * 2.01, t, 0.5, 0.11 * v);
    osc("sine", f * 3.02, t, 0.25, 0.045 * v);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31];
  const SFX = {
    thud(k) { if (!auOK()) return; k = k || 1; const t = now();
      osc("sine", vary(150, 0.05), t, 0.22, 0.85 * k, null, 0.003, 48);
      noise(t, 0.09, vary(0.45, 0.15) * k, "lowpass", vary(1200, 0.12), 0.7);
      noise(t, 0.014, 0.22 * k, "highpass", 3200, 0.7);
      duck(0.6, 0.15); },
    perfect(streak) { if (!auOK()) return; const t = now();
      const i = Math.min(Math.max(0, streak - 1), PENTA.length - 1);
      const f = 523.25 * Math.pow(2, PENTA[i] / 12);
      bell(f, t); osc("triangle", f * 2, t + 0.03, 0.22, 0.05);
      duck(0.5, 0.3); },
    release() { if (!auOK()) return; const t = now();
      osc("square", vary(1700, 0.05), t, 0.025, 0.05);
      noise(t, 0.03, 0.08, "highpass", 4500); },
    whoosh() { if (!auOK()) return; const t = now(); noise(t, 0.3, 0.2, "bandpass", 350, 1.4, null, 0.05, 1500); },
    winch() { if (!auOK()) return; const t = now(); osc("sawtooth", 70, t, 0.32, 0.018, null, 0.05, 110); },
    topple() { if (!auOK()) return; const t = now();
      noise(t, 0.45, 0.28, "bandpass", 900, 2.5, null, 0.02, 280);
      osc("sawtooth", 120, t, 0.4, 0.04, null, 0.01, 55); },
    crash() { if (!auOK()) return; const t = now();
      noise(t, 0.9, 0.55, "lowpass", 2600, 0.6, null, 0.003, 280);
      osc("sine", 95, t, 0.5, 0.75, null, 0.003, 32);
      noise(t + 0.07, 0.45, 0.18, "highpass", 3200, 0.5);
      duck(0.35, 0.5); },
    fall() { if (!auOK()) return; const t = now(); osc("sine", 720, t, 0.6, 0.07, null, 0.01, 170); },

  function fxPlayer(p, dt) {

    p.trauma = Math.max(0, p.trauma - dt * 1.6);
    p.squash = Math.max(0, p.squash - dt * 7);
    p.flash = Math.max(0, p.flash - dt);
    p.attackFlash = Math.max(0, p.attackFlash - dt * 0.8);

    for (const s of p.pops) { s.life -= dt * 0.8; s.y += dt * 0.9; }

    for (const pl of p.planes) pl.x += pl.dir * 0.22 * dt;
    p.planes = p.planes.filter(pl => pl.x > -0.6 && pl.x < 1.6);

    const n = floors(p);
    if (n < 20 && p.birds.length < 2 && Math.random() < dt * 0.12) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const flock = []; const k = 3 + (Math.random() * 3 | 0);
      for (let i = 0; i < k; i++) flock.push({ ox: -i * 0.04 * dir, oy: (i % 2 ? 1 : -1) * i * 0.18, ph: Math.random() * 6 });
      p.birds.push({ dir, x: dir > 0 ? -0.2 : 1.2, y: p.cam + 3 + Math.random() * Math.max(2, p.vf - 5), v: 0.12 + Math.random() * 0.06, flock });
    }
    for (const b of p.birds) b.x += b.dir * b.v * dt;

    }

  let acc = 0;
  function update(dt) {
    clock += dt;
    if (screen === "game") {
      if (state === "countdown") {
        const before = Math.ceil(countdown - 0.6);

        const after = Math.ceil(countdown - 0.6);
        if (after !== before) SFX.beep(after < 1);
        if (countdown <= 0.6) state = "play";
      } else if (state === "play" && countdown > 0) countdown -= dt;

        if (Math.ceil(timeLeft) !== before && timeLeft <= 5 && timeLeft > 0) SFX.tick();

  // =====================================================================
  //  Online (claude.ai "room" veya PeerJS)
  // =====================================================================
  const net = { api: null, apiP: null, room: null, code: "", host: false, r: 0, lastAtk: 0, oppSeen: 0, lastSend: 0, doneAt: 0, lastPr: null };
  const me = () => P[0];
  const ROOM_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

  function getRoomApi() {
    if (!net.apiP) {

      net.apiP.then(a => { net.api = a; });

  }

  function wrapRoom(nr) {
    const t = {
      kind: "room",
      send(d) { nr.presence(d).catch(() => {}); },
      opp() {

        for (const p of peers) { if (p.sameTab || p.kind !== "viewer") continue; const pr = p.presence; if (pr && pr.v === 2) return pr; }
        return null;
      },
      leave() { return nr.leave(); },
    };
    nr.onPeers(() => updateRoomStatus(), () => { if (net.room === t) { net.room = null; setRoomStatus("Bağlantı koptu. Odaya yeniden katılın."); refreshMenu(); } });
    return t;
  }

  let peerLibP = null;
  function loadPeerJS() {
    if (window.Peer) return Promise.resolve();

  async function peerTransport(code, host) {

  function joinError(e) {

    if (c === "load") return "Online bileşeni yüklenemedi. İnternet bağlantını kontrol et.";
    if (c === "network" || c === "server-error" || c === "socket-error" || c === "socket-closed") return "Bağlantı sunucusuna ulaşılamadı. İnternetini kontrol edip tekrar dene.";

  async function joinRoom(code, host, retried) {

    if (code.length !== 4) { setRoomStatus("Kod 4 karakter olmalı."); return; }
    setRoomStatus("Bağlanıyor…");
    if (net.room) { const old = net.room; net.room = null; try { await old.leave(); } catch (e) {} }
    try {
      const api = await getRoomApi();
      if (api) net.room = wrapRoom(await api.join("kule-" + code.toLowerCase()));
      else if (canPeer()) net.room = await peerTransport(code, host);
      else { setRoomStatus("Online mod bu görünümde kullanılamıyor. Oyunu web adresinden aç ya da claude.ai'de giriş yapmış olarak aç."); refreshMenu(); return; }

  async function leaveRoom() {

  }
  function oppPeer() { return net.room ? net.room.opp() : null; }
  setInterval(() => { if (net.room && net.room.kind === "peer") pushPresence(true); }, 500);

  function stName() {
    if (screen !== "game" || state === "ready") return "lobby";
    if (state === "countdown") return "cd";
    if (state === "over") return "over";
    if (cfg.mode === "classic" && !me().alive) return "dead";
    if (cfg.mode === "timed" && timeLeft <= 0) return "done";
    return "play";
  }

  function pushPresence(force) {
    if (!net.room) return;
    const t = performance.now();
    if (!force && t - net.lastSend < 66) return;
    net.lastSend = t;
    const p = me();
    const blocks = p.blocks || [];
    const off = Math.max(0, blocks.length - 24);
    const r4 = v => Math.round(v * 10000) / 10000;
    const data = {
      v: 2, st: stName(), ready: !!p.ready, r: net.r, mode: cfg.mode, host: net.host,
      sc: p.score | 0, lv: p.lives | 0, stk: p.streak | 0, inc: p.incoming | 0, atk: p.atk | 0, ms: p.misses | 0,
      off, b: blocks.slice(off).map(b => [r4(b.x), b.perfect ? 1 : 0]),

      fx: p.fall ? r4(p.fall.x) : 0, fy: p.fall ? r4(p.fall.y) : 0, fv: p.fall ? r4(p.fall.vy) : 0,
      tp: p.topple ? [p.topple.side, r4(p.topple.px), r4(p.topple.bx), r4(p.topple.th)] : null,

  }

  // Uzak oyuncu: alınan durumdan yeniden kurulur, arada yerel olarak ilerletilir.
  function applyRemote(pr) {
    const o = P[1];
    o.remote = true;
    o.present = !!pr;
    if (!pr) return;
    o.ready = !!pr.ready;
    if (!net.host && pr.host && (pr.mode === "classic" || pr.mode === "timed") && pr.mode !== cfg.mode && (state === "ready" || state === "over")) { cfg.mode = pr.mode; refreshMenu(); }
    const sameRound = (pr.r | 0) === net.r && (state === "countdown" || state === "play" || state === "over");
    if (!sameRound) return;
    if (pr === net.lastPr) return;
    net.lastPr = pr;
    const blocks = [];
    const len = (pr.off | 0) + (Array.isArray(pr.b) ? pr.b.length : 0);
    for (let i = 0; i < len; i++) blocks.push(null);
    (Array.isArray(pr.b) ? pr.b : []).forEach((bb, i) => { if (Array.isArray(bb)) blocks[(pr.off | 0) + i] = { x: +bb[0] || 0.5, w: BW, perfect: !!bb[1] }; });
    if (!blocks.length) blocks.push(null);
    if (!blocks[0]) blocks[0] = { x: 0.5, w: BASE_W, perfect: false };

        addDust(o, nb.x, BW, y); o.squash = 1; o.trauma = Math.min(1, o.trauma + 0.2);
        if (PLANE_FLOORS.includes(y)) { const dir = Math.random() < 0.5 ? 1 : -1; o.planes.push({ dir, x: dir > 0 ? -0.4 : 1.4, y: y + 5 }); }
      }
    }

  function onlineTick() {

  // Kat çizimi: 3 cephe tipi (konut / ofis / gökdelen), kusursuz katlar altın.
  function drawFloor(p, x, y, w, h, idx, night, perfect) {

        ctx.fillStyle = lit ? "rgba(255,212,140," + Math.min(0.95, (night - 0.25) * 1.5) + ")" : css(mixRGB(hex(gold ? "#c9a54a" : p.g1), hex("#1b2238"), night * 0.7));
        ctx.fillRect(wx, wy, ww, wh);
        ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(wx, wy, ww, 1.5);
        if (hash(idx, i + 50) < 0.4) { ctx.fillStyle = gold ? "#a07a1a" : p.wallD; ctx.fillRect(wx - 2, wy + wh - 1, ww + 4, 2); for (let k = 0; k <= 3; k++) ctx.fillRect(wx - 2 + (ww + 4) * k / 3, wy + wh * 0.72, 1, wh * 0.28); }
      }

  function drawView(V) {
    const p = V.p, o = other(p);

      ctx.font = "800 " + size + "px " + COND;
      const w = ctx.measureText(label).width + 22;
      ctx.fillStyle = bg; rr(bannerX, bannerY, w, size + 12, (size + 12) / 2); ctx.fill();
      txt(label, bannerX + w / 2, bannerY + (size + 12) / 2 + 1, size, fg, { ls: "0.5px" });
      bannerX += w + 8;
    }
    if (state === "play" && p.alive && p.blocks) {
      if (wind) pill("RÜZGÂR " + (wind.dir > 0 ? "→" : "←") + " " + (wind.s > 0.9 ? "SERT" : "ORTA"), "rgba(14,17,26,0.78)", "#e8f2ff");
      else if (windAt(p.blocks.length + 1)) pill("RÜZGÂR GELİYOR", "rgba(14,17,26,0.6)", "rgba(232,242,255,0.75)");
      if (p.incoming > 0) pill("⚡ GELEN SALDIRI ×" + p.incoming, "rgba(214,40,60,0.92)", "#fff");
    }
    if ((p.storm && (p.phase === "swing" || p.phase === "lower")) || p.attackFlash > 0) {
      const a = Math.max(p.attackFlash * 0.5, p.storm && p.phase !== "drop" ? 0.16 + 0.1 * Math.sin(clock * 10) : 0);
      const vg = ctx.createRadialGradient(VW / 2, playH / 2, Math.min(VW, playH) * 0.35, VW / 2, playH / 2, Math.max(VW, playH) * 0.75);
      vg.addColorStop(0, "rgba(255,40,60,0)"); vg.addColorStop(1, "rgba(255,40,60," + a + ")");
      ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, playH);
    }
    if (p.flash > 0) { ctx.fillStyle = "rgba(255,255,255," + (p.flash / 0.15) * 0.25 + ")"; ctx.fillRect(0, 0, VW, playH); }

    // --- alt bilgi şeridi
    ctx.fillStyle = "rgba(12,14,21,0.95)"; ctx.fillRect(0, playH, VW, HUD + 20);
    ctx.fillStyle = p.accent; ctx.fillRect(0, playH, VW, 3);
    const pad = 14;
    const nameSize = Math.round(Math.min(HUD * 0.28, VW / 15));
    const label = isSingle() ? "REKOR " + fmtScore(Math.max(best(), p.score || 0)) : isOnline() ? (V.remote ? "RAKİP" : "SEN") : p.name;
    txt(label, pad, playH + HUD * 0.32, nameSize, isSingle() ? "rgba(243,239,231,0.7)" : p.accent, { align: "left", ls: "1.5px" });
    const rowY = playH + HUD * 0.66;
    let hx = pad;
    if (cfg.mode === "classic") {
      const hs = Math.max(10, Math.min(16, HUD * 0.22));
      for (let i = 0; i < LIVES; i++) { heart(hx + hs / 2, rowY - hs / 2, hs, i < (p.lives || 0) ? "#ff4d5e" : "rgba(255,255,255,0.14)"); hx += hs + 4; }
      hx += 6;
    }
    if (!isSingle()) {
      const pipW = Math.max(7, Math.min(14, VW / 36));
      const filled = (p.streak || 0) % ATTACK_EVERY;
      for (let i = 0; i < ATTACK_EVERY; i++) { ctx.fillStyle = i < filled ? "#f4b400" : "rgba(255,255,255,0.14)"; rr(hx + i * (pipW + 3), rowY - 3, pipW, 6, 2); ctx.fill(); }
    } else if (p.streak > 1) txt("SERİ ×" + p.streak, hx, rowY, Math.round(nameSize * 0.8), "#ffd34d", { align: "left" });
    const numSize = Math.round(Math.min(HUD * 0.48, VW / 9));
    txt(fmtScore(p.score || 0), VW - pad, playH + HUD * 0.4, numSize, "#f3efe7", { align: "right", f: DISP, w: "400" });
    txt("KAT " + n + " · " + meters(n) + " m", VW - pad, playH + HUD * 0.78, Math.round(numSize * 0.38), "rgba(243,239,231,0.65)", { align: "right", ls: "0.5px" });
    if (screen === "game" && (state === "play" || state === "countdown")) {
      if (cfg.mode === "timed") {
        const tl = V.remote ? (+((oppPeer() || {}).tl) || 0) : timeLeft;
        const sec = Math.ceil(tl);
        const warn = sec <= 10 && !V.remote;
        txt(Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"), VW / 2, playH + HUD / 2 + 1, Math.round(numSize * 0.8), warn ? "#ff6b78" : "#f3efe7", { f: DISP, w: "400", a: warn ? 0.75 + 0.25 * Math.sin(clock * 10) : 1 });
      }
    }

    // --- durum panelleri
    const big = Math.round(clamp(Math.min(VW / 9, playH / 8), 20, 46));
    const mid = Math.round(big * 0.52), small = Math.round(Math.max(13, big * 0.4));
    const pulse = 0.6 + 0.4 * Math.sin(clock * 5);
    const modeLine = cfg.mode === "timed" ? "60 saniye · en çok puan kazanır" : "Klasik · 3 can";
    if (screen === "game") {
      if (state === "ready") {
        if (V.remote) {
          const pr = oppPeer();
          panel(V, pr
            ? [{ t: "RAKİP BAĞLANDI", s: big * 0.8, f: DISP, w: "400", c: p.accent }, { t: pr.ready ? "HAZIR ✓" : "Hazırlanıyor…", s: mid, c: pr.ready ? p.light : "#f3efe7", a: pr.ready ? 1 : pulse }]
            : [{ t: "RAKİP BEKLENİYOR", s: big * 0.8, f: DISP, w: "400", c: p.accent }, { t: "Oda kodu: " + net.code, s: mid, ls: "2px" }, { t: "Arkadaşın Online → Katıl ile bu kodu girsin", s: small, w: "600", c: "#a3a9b8" }], p.accent, playH);
        } else {
          panel(V, [
            { t: isSingle() || isOnline() ? "HAZIR MISIN?" : p.name, s: big, f: DISP, w: "400", c: isSingle() ? "#f4b400" : p.accent },
            { t: "Blok sallanırken dokun, düşsün.", s: small, w: "600" },
            { t: "Tam üstüne oturursa KUSURSUZ, yarısı taşarsa devrilir.", s: small, w: "600" },
            { t: modeLine, s: small, w: "600", c: "#a3a9b8" },
            { t: p.ready ? "HAZIR ✓  RAKİP BEKLENİYOR" : "BAŞLAMAK İÇİN DOKUN", s: mid, c: p.ready ? p.light : "#f3efe7", a: p.ready ? 1 : pulse, gap: 1.6, ls: "1px" },
          ], isSingle() ? "#f4b400" : p.accent, playH);
        }
      } else if (state === "countdown" || (state === "play" && countdown > 0)) {
        const k = Math.ceil(countdown - 0.6);
        const sc2 = 1 + (((countdown - 0.6) % 1) + 1) % 1 * 0.25;
        txt(k >= 1 ? String(k) : "BAŞLA!", VW / 2, playH * 0.42, Math.round(big * 2 * sc2), "#ffffff", { f: DISP, w: "400", stroke: 8, a: 0.95 });
      } else if (state === "play" && !p.alive && !isSingle()) {
        const lead = (p.score || 0) - (o.score || 0);
        panel(V, [
          { t: "CANLARIN BİTTİ", s: big * 0.85, f: DISP, w: "400", c: p.accent },
          { t: fmtScore(p.score) + " puan · " + n + " kat", s: mid },
          { t: o.alive ? (lead > 0 ? "Rakibin seni geçmek için " + fmtScore(lead + 1) + " puan daha almalı" : "Rakip önde, bitirmesini bekle") : "Bekleniyor…", s: small, w: "600", c: "#a3a9b8" },
        ], p.accent, playH);
      } else if (state === "play" && cfg.mode === "timed" && timeLeft <= 0 && !V.remote) {
        panel(V, [{ t: "SÜRE DOLDU", s: big, f: DISP, w: "400", c: p.accent }, { t: "Rakip bekleniyor…", s: small, w: "600", c: "#a3a9b8" }], p.accent, playH);
      } else if (state === "over") {
        const canTap = clock - overAt > 0.9;
        const lines = [];
        if (overNote) lines.push({ t: overNote.toUpperCase(), s: small, c: "#a3a9b8", ls: "1px" });
        if (isSingle()) {
          lines.push({ t: newBest ? "YENİ REKOR!" : "OYUN BİTTİ", s: big, f: DISP, w: "400", c: newBest ? "#ffd34d" : "#f3efe7" });
          lines.push({ t: fmtScore(p.score) + " puan", s: Math.round(mid * 1.3), f: DISP, w: "400" });
          lines.push({ t: n + " kat · " + meters(n) + " m · rekor " + fmtScore(best()), s: small, w: "600", c: "#a3a9b8" });
          lines.push({ t: canTap ? "TEKRAR İÇİN DOKUN" : " ", s: mid, a: pulse, gap: 1.6, ls: "1px" });
          panel(V, lines, newBest ? "#ffd34d" : "#f4b400", playH);
        } else {
          const a = p.score || 0, b = o.score || 0;
          const won = a > b || (a === b && n > floors(o)), lost = a < b || (a === b && n < floors(o));
          const col = won ? p.light : lost ? "#ff9aa4" : "#f3efe7";
          if (isOnline() && V.remote) {
            lines.push({ t: won ? "RAKİP KAZANDI" : lost ? "RAKİP KAYBETTİ" : "BERABERE", s: big * 0.8, f: DISP, w: "400", c: p.accent });
            lines.push({ t: fmtScore(a) + " puan · " + n + " kat", s: mid });
            const pr = oppPeer();
            if (pr) lines.push({ t: pr.ready ? "TEKRAR İÇİN HAZIR ✓" : "Karar veriyor…", s: small, c: pr.ready ? p.light : "#a3a9b8" });
          } else {
            lines.push({ t: won ? "KAZANDIN!" : lost ? "KAYBETTİN" : "BERABERE", s: big, f: DISP, w: "400", c: col });
            lines.push({ t: fmtScore(a) + "  —  " + fmtScore(b), s: mid });
            lines.push({ t: n + " kat · rakip " + floors(o) + " kat", s: small, w: "600", c: "#a3a9b8" });
            lines.push({ t: p.ready ? "HAZIR ✓  RAKİP BEKLENİYOR" : canTap ? "TEKRAR İÇİN DOKUN" : " ", s: mid, c: p.ready ? p.light : "#f3efe7", a: p.ready ? 1 : pulse, gap: 1.6, ls: "1px" });
          }
          panel(V, lines, col, playH);
        }
      }
    }
    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#0d1018"; ctx.fillRect(0, 0, W, H);
    for (const V of views()) drawView(V);
    if (isOnline()) { const y = Math.round(H * 0.38); hazard(0, y - 3, W, 6, "#15171c", "#f4b400"); }
  }

  // =====================================================================
  //  Giriş
  // =====================================================================
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (screen !== "game") return;
    tap(P[0]);
  });
  cv.addEventListener("contextmenu", e => e.preventDefault());
  window.addEventListener("keydown", e => {
    if (screen !== "game" || e.repeat) return;
    if (e.target && e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === " " || k === "enter") { e.preventDefault(); tap(P[0]); }
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && screen === "game") keepAwake(); });

  // =====================================================================
  //  Menü
  // =====================================================================
  const menuEl = $("#menu"), menuBtn = $("#menuBtn"), onlineBox = $("#onlineBox");
  function setRoomStatus(t) { $("#roomStatus").textContent = t; }
  function inviteUrl() { return location.origin + location.pathname + "#oda-" + net.code.toLowerCase(); }
  function updateRoomStatus() {
    if (!net.room) return;
    const el = $("#roomStatus");
    el.textContent = "";
    const b = document.createElement("div"); b.className = "code"; b.textContent = net.code;
    const sp = document.createElement("span");
    const opp = oppPeer();
    if (opp && opp.host && !net.host && (opp.mode === "classic" || opp.mode === "timed") && opp.mode !== cfg.mode) {
      cfg.mode = opp.mode;
      for (const o of document.querySelectorAll('[data-group="mode"] .opt')) o.setAttribute("aria-pressed", String(o.dataset.value === cfg.mode));
    }
    sp.textContent = opp
      ? "Rakip bağlandı ✓  Mod: " + (cfg.mode === "timed" ? "60 Saniye" : "Klasik") + (net.host ? "" : " (odayı kuran seçer)")
      : (net.host ? "Arkadaşın Online → kodu yazıp Katıl'a bassın ya da davet linkini açsın. Rakip bekleniyor…" : "Odaya girdin. Rakip bekleniyor…");
    el.append(b, sp);
    const showShare = !IN_CLAUDE && net.host;
    $("#shareRow").hidden = !showShare;
    if (showShare) $("#shareUrl").textContent = inviteUrl();
  }
  function refreshMenu() {
    for (const seg of document.querySelectorAll(".seg[data-group]")) {
      const key = seg.dataset.group;
      for (const b of seg.querySelectorAll(".opt")) b.setAttribute("aria-pressed", String(cfg[key] === b.dataset.value));
    }
    const online = isOnline();
    onlineBox.hidden = !online;
    $("#leaveRoom").hidden = !net.room;
    $("#mkRoom").hidden = !!net.room; $("#joinRoom").hidden = !!net.room; $("#code").hidden = !!net.room;
    if (!net.room) $("#shareRow").hidden = true;
    $("#play").disabled = online && !net.room;
    const modeLocked = online && net.room && !net.host;
    for (const b of document.querySelectorAll('[data-group="mode"] .opt')) b.disabled = !!modeLocked;
    $("#sfxBtn").setAttribute("aria-pressed", String(AU.sfxOn)); $("#sfxLbl").textContent = AU.sfxOn ? "Açık" : "Kapalı";
    $("#musicBtn").setAttribute("aria-pressed", String(AU.musicOn)); $("#musicLbl").textContent = AU.musicOn ? "Açık" : "Kapalı";
    if (net.room) updateRoomStatus();
    updateRecordLine();
  }
  function updateRecordLine() {
    const c = parseInt(store.get("best-classic", "0"), 10) || 0, t = parseInt(store.get("best-timed", "0"), 10) || 0;
    $("#recordLine").textContent = "Rekor: " + fmtScore(c) + " · 60 sn: " + fmtScore(t);
  }
  for (const seg of document.querySelectorAll(".seg[data-group]")) {
    seg.addEventListener("click", e => {
      const b = e.target.closest(".opt");
      if (!b || b.disabled) return;
      auInit(); SFX.click();
      cfg[seg.dataset.group] = b.dataset.value;
      store.set(seg.dataset.group, b.dataset.value);
      if (seg.dataset.group === "layout" && b.dataset.value !== "online" && net.room) leaveRoom();
      if (seg.dataset.group === "layout" && b.dataset.value === "online") getRoomApi();
      if (net.room) pushPresence(true);
      refreshMenu();
      P.forEach(p => resetPlayer(p, 1));
      placeMenuBtn();
    });
  }
  $("#sfxBtn").addEventListener("click", () => { auInit(); setSfx(!AU.sfxOn); SFX.click(); refreshMenu(); });
  $("#musicBtn").addEventListener("click", () => { auInit(); setMusic(!AU.musicOn); refreshMenu(); });
  $("#mkRoom").addEventListener("click", () => { auInit(); SFX.click(); joinRoom(newCode(), true); });
  $("#joinRoom").addEventListener("click", () => { auInit(); SFX.click(); joinRoom($("#code").value, false); });
  $("#code").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); joinRoom($("#code").value, false); } });
  $("#leaveRoom").addEventListener("click", () => { SFX.click(); leaveRoom(); });
  $("#shareBtn").addEventListener("click", () => {
    const url = inviteUrl();
    const data = { title: "Kule Yarışı", text: "Kule Yarışı'nda benimle yarış! Oda kodu: " + net.code, url };
    if (navigator.share) { navigator.share(data).catch(() => {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => { $("#shareBtn").textContent = "Kopyalandı ✓"; setTimeout(() => { $("#shareBtn").textContent = "Davet linki gönder"; }, 1800); }).catch(() => selectLink());
    else selectLink();
  });
  function selectLink() { const r = document.createRange(); r.selectNodeContents($("#shareUrl")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  $("#play").addEventListener("click", () => {
    auInit(); SFX.click();
    screen = "game"; state = "ready";
    P.forEach(p => resetPlayer(p, 1));
    if (isOnline()) { P[1].remote = true; pushPresence(true); }
    menuEl.hidden = true; menuBtn.hidden = false;
    placeMenuBtn(); keepAwake();
  });
  menuBtn.addEventListener("click", () => {
    SFX.click();
    screen = "menu"; state = "ready"; AU.level = 0;
    P.forEach(p => resetPlayer(p, 1));
    if (isOnline()) { me().ready = false; pushPresence(true); }
    menuEl.hidden = false; menuBtn.hidden = true;
    refreshMenu();
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
  });
  function placeMenuBtn() {
    const st = menuBtn.style;
    st.left = st.top = st.right = st.transform = "";
    if (isOnline()) { st.left = "50%"; st.top = Math.round(H * 0.38) + "px"; st.transform = "translate(-50%,-50%)"; }
    else { st.right = "max(12px, env(safe-area-inset-right, 0px))"; st.top = "calc(12px + env(safe-area-inset-top, 0px))"; }
  }

  // =====================================================================
  //  Menü arkası canlı sahne: kendi kendine oynayan kule(ler)
  // =====================================================================
  function demoTick(dt) {
    for (const p of activePlayers()) {
      if (!p.blocks) continue;
      if (p.blocks.length > 45) resetPlayer(p, (Math.random() * 1e9) | 0);
      p.swayT += dt;
      if (p.phase === "lower") { p.phaseT += dt; p.t += dt; if (p.phaseT > 0.42) p.phase = "swing"; }
      else if (p.phase === "swing") {
        p.t += dt;
        const a = hookAngle(p);
        if (Math.abs(Math.sin(a)) * ROPE * BHW < 0.012 && p.t > 0.5) tryDropDemo(p);
      } else if (p.phase === "drop") {
        const f = p.fall; f.vy += G * dt; f.y -= f.vy * dt; f.rot *= Math.exp(-10 * dt);
        if (f.y <= topSurface(p)) { const ni = p.blocks.length; p.blocks.push({ x: 0.5 - swayAt(p, ni) + (Math.random() - 0.5) * 0.02, w: BW, perfect: Math.random() < 0.5 }); addDust(p, 0.5, BW, ni); p.squash = 1; p.fall = null; p.phase = "settle"; p.phaseT = 0; updateSwayAmp(p); }
      } else if (p.phase === "settle") { p.phaseT += dt; if (p.phaseT > 0.3) { p.swing = swingFor(p, p.blocks.length, false); p.t = 0; p.phase = "lower"; p.phaseT = 0; } }
      p.retract = Math.max(0, p.retract - dt);
    }
  }
  function tryDropDemo(p) { const a = hookAngle(p); p.fall = { x: 0.5 + Math.sin(a) * ROPE * BHW, y: pivotY(p) - Math.cos(a) * ROPE - 1, vy: 0, rot: a, drift: 0 }; p.phase = "drop"; p.retract = 0.3; }

  // =====================================================================
  //  PWA (yalnız normal web sitesinde)
  // =====================================================================
  if (!IN_CLAUDE && location.protocol === "https:") {
    try {
      const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l);
      const ai = document.createElement("link"); ai.rel = "apple-touch-icon"; ai.href = "icon-180.png"; document.head.appendChild(ai);
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    } catch (e) {}
  }

  // =====================================================================
  //  Başlat
  // =====================================================================
  resize();
  P.forEach(p => resetPlayer(p, 1));
  refreshMenu();
  if (isOnline()) getRoomApi();
  (() => { // davet linki: #oda-XXXX
    const m = /^#oda-([a-z0-9]{4})$/i.exec(location.hash || "");
    if (!m) return;
    cfg.layout = "online"; refreshMenu(); placeMenuBtn();
    $("#code").value = m[1].toUpperCase();
    joinRoom(m[1], false);
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  })();

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.25, (t - last) / 1000);
    last = t;
    if (screen === "menu") demoTick(dt);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
