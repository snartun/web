<title>Kule Yarışı</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1018">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=swap">
<style>
  /* Tek ekran oyun. Canvas tüm alanı kaplar; menü canvas'ın üstünde ortalanmış bir kart. Bilerek tek (koyu) tema. */
  :root {
    --bg: #0d1018;
    --panel: rgba(16, 19, 28, 0.9);
    --panel-line: rgba(255, 255, 255, 0.09);
    --fg: #f3efe7;
    --muted: #a3a9b8;
    --crane: #f4b400;
    --p1: #ff6a3d;
    --p2: #1fc2b0;
    --danger: #ff4d5e;
    --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --font-ui: "Barlow Condensed", "Arial Narrow", sans-serif;
    --font-body: "Barlow", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; height: 100%; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }

  #menu {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(180deg, rgba(8, 10, 16, 0.25), rgba(8, 10, 16, 0.7));
    overflow-y: auto;
  }
  .card {
    width: 100%; max-width: 440px;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 22px 20px 20px;
    display: grid; gap: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .brand { display: grid; gap: 4px; }
  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(30px, 9vw, 42px);
    line-height: 0.95;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .brand h1 span { color: var(--crane); }
  .brand p { margin: 0; color: var(--muted); font-size: 15px; }
  .group { display: grid; gap: 8px; }
  .group h2 {
    margin: 0;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
  .opt {
    appearance: none;
    text-align: left;
    border: 1px solid var(--panel-line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--fg);
    border-radius: 10px;
    padding: 10px 12px;
    display: grid; gap: 2px;
    cursor: pointer;
    min-width: 0;
    font: inherit;
  }
  .opt b { font-family: var(--font-ui); font-weight: 800; font-size: 19px; letter-spacing: 0.02em; text-transform: uppercase; }
  .opt small { color: var(--muted); font-size: 13px; line-height: 1.25; }
  .opt[aria-pressed="true"] { border-color: var(--crane); background: rgba(244, 180, 0, 0.12); }
  .opt[aria-pressed="true"] b { color: var(--crane); }
  .opt:focus-visible, .btn:focus-visible, #menuBtn:focus-visible, input:focus-visible { outline: 2px solid var(--crane); outline-offset: 2px; }

  .online { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--panel-line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { min-width: 0; }
  .online input {
    flex: 1 1 110px;
    font-family: var(--font-ui); font-weight: 800; font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase;
    background: rgba(0, 0, 0, 0.35); color: var(--fg);
    border: 1px solid var(--panel-line); border-radius: 8px; padding: 8px 10px;
  }
  .btn {
    appearance: none; cursor: pointer;
    font-family: var(--font-ui); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 17px;
    border-radius: 8px; padding: 10px 14px;
    border: 1px solid var(--panel-line);
    background: rgba(255, 255, 255, 0.07); color: var(--fg);
  }
  .btn.primary {
    background: var(--crane); color: #1b1400; border-color: transparent;
    font-size: 24px; padding: 14px; width: 100%;
    font-family: var(--font-display); letter-spacing: 0.04em;
  }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .status { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.4; }
  .status strong { color: var(--fg); }
  .code { font-family: var(--font-ui); font-weight: 800; font-size: 30px; letter-spacing: 0.25em; color: var(--crane); }
  .foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .foot span { font-variant-numeric: tabular-nums; }

  #menuBtn {
    position: absolute;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(13, 16, 24, 0.85); color: var(--fg);
    font-family: var(--font-ui); font-weight: 800; font-size: 13px; letter-spacing: 0.04em;
    cursor: pointer; z-index: 5;
    display: grid; place-items: center;
  }
  @media (prefers-reduced-motion: reduce) { .card { backdrop-filter: none; } }
</style>

<div id="stage">
  <canvas id="c" aria-label="Kule Yarışı oyun alanı"></canvas>
  <button id="menuBtn" type="button" aria-label="Menüye dön" hidden>MENÜ</button>

  <div id="menu">
    <div class="card" role="dialog" aria-labelledby="ttl">
      <div class="brand">
        <h1 id="ttl">KULE <span>YARIŞI</span></h1>
        <p>İki vinç, tek gökyüzü. Bloğu tam üste bırak, kuleni rakibinden yükseğe çık.</p>
      </div>

      <div class="group">
        <h2>Oyun</h2>
        <div class="seg" data-group="mode">
          <button class="opt" type="button" id="opt-classic" data-value="classic"><b>Klasik</b><small>Kule çökene kadar</small></button>
          <button class="opt" type="button" id="opt-timed" data-value="timed"><b>60 Saniye</b><small>Süre bitince en yüksek kazanır</small></button>
        </div>
      </div>

      <div class="group">
        <h2>Nasıl oynuyorsunuz?</h2>
        <div class="seg" data-group="layout">
          <button class="opt" type="button" id="opt-face" data-value="face"><b>Karşılıklı</b><small>Telefon masada, iki uçta</small></button>
          <button class="opt" type="button" id="opt-side" data-value="side"><b>Yan yana</b><small>Telefon yatay, ikiniz düz</small></button>
          <button class="opt" type="button" id="opt-online" data-value="online"><b>Online</b><small>İki ayrı telefon</small></button>
        </div>
      </div>

      <div class="online" id="onlineBox" hidden>
        <div class="row">
          <button class="btn" type="button" id="mkRoom">Oda kur</button>
          <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="4" placeholder="KOD" aria-label="Oda kodu">
          <button class="btn" type="button" id="joinRoom">Katıl</button>
        </div>
        <p class="status" id="roomStatus">Bir oda kur ve kodu arkadaşına söyle, ya da onun kodunu yazıp katıl.</p>
        <button class="btn" type="button" id="leaveRoom" hidden>Odadan çık</button>
      </div>

      <button class="btn primary" type="button" id="play">OYNA</button>

      <div class="foot">
        <span id="recordLine">Rekor: —</span>
        <span>5 kusursuz = rakibin vinci hızlanır</span>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // =====================================================================
  //  Ayarlar
  // =====================================================================
  const FLOOR_M = 3.2;            // bir katın yüksekliği (m)
  const BASE_W = 0.5;             // temel genişliği (görünüm genişliğinin oranı)
  const PERFECT = 0.012;          // kusursuz bırakma toleransı
  const ATTACK_EVERY = 5;         // kaç kusursuzda bir saldırı
  const BOOST_TIME = 4;           // saldırı süresi (sn)
  const BOOST_MUL = 1.7;          // saldırıda vinç hız çarpanı
  const TIMED_SECONDS = 60;
  const DISP = '"Archivo Black", "Arial Black", Impact, sans-serif';
  const COND = '"Barlow Condensed", "Arial Narrow", sans-serif';

  const $ = s => document.querySelector(s);
  const cv = $("#c");
  const ctx = cv.getContext("2d");

  let W = 1, H = 1, DPR = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    placeMenuBtn();
  }
  window.addEventListener("resize", resize);

  // =====================================================================
  //  Yardımcılar
  // =====================================================================
  function hash(a, b) {
    let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function css(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
  function ramp(stops, t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const a = stops[i - 1], b = stops[i];
        return mixRGB(a[1], b[1], (t - a[0]) / (b[0] - a[0]));
      }
    }
    return stops[stops.length - 1][1];
  }
  const meters = n => (n * FLOOR_M).toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }
  function hazard(x, y, w, h, a, b) {
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = a; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = b;
    const s = Math.max(4, h * 1.4);
    for (let i = -h * 2; i < w + h * 2; i += s * 2) {
      ctx.beginPath();
      ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + s, y + h);
      ctx.lineTo(x + i + s + h, y); ctx.lineTo(x + i + h, y);
      ctx.fill();
    }
    ctx.restore();
  }
  function txt(str, x, y, size, color, o) {
    o = o || {};
    ctx.globalAlpha = o.a == null ? 1 : o.a;
    ctx.font = (o.w || "800") + " " + size + "px " + (o.f || COND);
    ctx.textAlign = o.align || "center";
    ctx.textBaseline = o.base || "middle";
    if ("letterSpacing" in ctx) ctx.letterSpacing = o.ls || "0px";
    if (o.stroke) { ctx.lineJoin = "round"; ctx.lineWidth = o.stroke; ctx.strokeStyle = "rgba(8,10,18,0.75)"; ctx.strokeText(str, x, y); }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
    ctx.globalAlpha = 1;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  }
  function fit(str, maxW, size, f, w) {
    ctx.font = (w || "800") + " " + size + "px " + (f || COND);
    const m = ctx.measureText(str).width;
    return m > maxW ? Math.max(9, Math.floor(size * maxW / m)) : size;
  }

  // =====================================================================
  //  Ses ve titreşim
  // =====================================================================
  let ac = null;
  function ensureAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
    } catch (e) { ac = null; }
  }
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!ac) return;
    try {
      const t = ac.currentTime + (delay || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function thud() { tone(140, 0.14, "triangle", 0.12, 70); tone(90, 0.1, "square", 0.03, 50); }
  function ding(k) { tone(660 + Math.min(k, 8) * 60, 0.18, "triangle", 0.08); tone(990 + Math.min(k, 8) * 90, 0.22, "sine", 0.04, null, 0.05); }
  function crash() { tone(200, 0.6, "sawtooth", 0.07, 45); }
  function alarm() { tone(880, 0.12, "square", 0.05); tone(660, 0.12, "square", 0.05, null, 0.14); tone(880, 0.12, "square", 0.05, null, 0.28); }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // =====================================================================
  //  Kalıcı tercihler (yalnız bu tarayıcı)
  // =====================================================================
  const store = {
    get(k, d) { try { const v = localStorage.getItem("kule-" + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("kule-" + k, String(v)); } catch (e) {} },
  };
  const records = { classic: parseInt(store.get("rekor", "0"), 10) || 0, timed: parseInt(store.get("rekor-60", "0"), 10) || 0 };
  function saveRecord(n) {
    const k = cfg.mode;
    if (n > records[k]) { records[k] = n; store.set(k === "classic" ? "rekor" : "rekor-60", n); }
  }

  const cfg = {
    mode: store.get("mode", "classic") === "timed" ? "timed" : "classic",
    layout: ["face", "side", "online"].includes(store.get("layout", "face")) ? store.get("layout", "face") : "face",
  };

  // =====================================================================
  //  Sahne verileri (şehir, bulutlar, yıldızlar)
  // =====================================================================
  function makeCity(seed, minH, maxH) {
    const r = rng(seed), out = [];
    let x = -0.03;
    while (x < 1.03) {
      const w = 0.045 + r() * 0.09;
      const b = { x, w, h: minH + r() * (maxH - minH), cap: r(), wins: [] };
      const cols = Math.max(1, Math.floor(w / 0.018)), rows = Math.floor(b.h / 0.035);
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) if (r() < 0.32) b.wins.push([(i + 0.5) / cols, (j + 0.6) / (rows + 0.4)]);
      out.push(b);
      x += w + 0.004 + r() * 0.01;
    }
    return out;
  }
  const cityFar = makeCity(11, 0.12, 0.42);
  const cityNear = makeCity(29, 0.06, 0.3);
  const stars = []; (() => { const r = rng(5); for (let i = 0; i < 70; i++) stars.push({ x: r(), y: r(), s: 0.5 + r() * 1.4, tw: r() * 6 }); })();
  const clouds = []; (() => { const r = rng(17); for (let k = 0; k < 40; k++) clouds.push({ alt: 3 + k * 4.2 + r() * 2, x: r(), s: 0.6 + r() * 0.8, v: 0.004 + r() * 0.01, sp: r() < 0.5 ? 0 : 1 }); })();

  const cloudSprites = [0, 1].map(k => {
    const c = document.createElement("canvas"); c.width = 320; c.height = 140;
    const g = c.getContext("2d"); const r = rng(41 + k * 7);
    for (let i = 0; i < 14; i++) {
      const x = 50 + r() * 220, y = 70 + (r() - 0.3) * 40, rad = 26 + r() * 36;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, "rgba(255,255,255,0.9)"); gr.addColorStop(0.6, "rgba(255,255,255,0.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
    }
    return c;
  });

  const SKY_TOP = [[0, hex("#3f86d6")], [0.35, hex("#4d74b8")], [0.62, hex("#2c2d66")], [1, hex("#060a1c")]];
  const SKY_BOT = [[0, hex("#cfe7f7")], [0.35, hex("#ffc98c")], [0.62, hex("#ef7f66")], [1, hex("#1f2a52")]];
  const FAR_TINT = [[0, hex("#8aa3c0")], [0.35, hex("#9b8fa8")], [0.62, hex("#5a4c7a")], [1, hex("#141a36")]];
  const NEAR_TINT = [[0, hex("#5d728e")], [0.35, hex("#5f5371")], [0.62, hex("#352c52")], [1, hex("#0b1026")]];

  // =====================================================================
  //  Oyuncular
  // =====================================================================
  const PLAYERS = [
    { name: "OYUNCU 1", accent: "#ff6a3d", light: "#ffb89c", g0: "#ffd9bd", g1: "#e98a62", g2: "#8a3f27" },
    { name: "OYUNCU 2", accent: "#1fc2b0", light: "#8ef0e2", g0: "#c4f3ea", g1: "#3ba99c", g2: "#1a5b60" },
  ];
  const P = PLAYERS.map(d => Object.assign({}, d));

  let screen = "menu";    // menu | game
  let state = "ready";    // ready | countdown | play | over
  let countdown = 0, overAt = 0, clock = 0, timeLeft = TIMED_SECONDS, overNote = "";

  function resetPlayer(p) {
    p.blocks = [{ x: (1 - BASE_W) / 2, w: BASE_W }];
    p.combo = 0; p.alive = true; p.cam = 0; p.vf = 9;
    p.debris = []; p.pops = []; p.parts = []; p.rings = []; p.streaks = [];
    p.ready = false; p.shake = 0; p.boostT = 0; p.sway = 0; p.atk = 0; p.attackFlash = 0;
    spawn(p);
  }
  const floors = p => (p.blocks ? p.blocks.length - 1 : 0);

  function windAt(i) {
    const zones = [[8, 12, 1], [18, 23, -1], [29, 35, 1]];
    for (let k = 0; k < zones.length; k++) { const z = zones[k]; if (i >= z[0] && i <= z[1]) return { s: 0.55 + k * 0.2, dir: z[2] }; }
    if (i >= 40 && i % 12 < 6) return { s: 1.15, dir: Math.floor(i / 12) % 2 ? -1 : 1 };
    return null;
  }

  function speedOf(p) {
    const n = floors(p);
    return Math.min(1.25, 0.4 + n * 0.022) * (p.boostT > 0 ? BOOST_MUL : 1);
  }

  function spawn(p) {
    const top = p.blocks[p.blocks.length - 1];
    const dir = p.blocks.length % 2 ? 1 : -1;
    p.cur = { w: top.w, dir, x: dir > 0 ? -top.w * 0.25 : 1 - top.w * 0.75 };
  }

  function other(p) { return p === P[0] ? P[1] : P[0]; }

  function addDust(p, b, idx) {
    for (let s = 0; s < 2; s++) {
      const ex = s ? b.x + b.w : b.x;
      for (let i = 0; i < 7; i++) p.parts.push({ x: ex, y: idx, vx: (s ? 1 : -1) * (0.05 + Math.random() * 0.12), vy: Math.random() * 0.8, life: 0.5 + Math.random() * 0.4, size: 2 + Math.random() * 3 });
    }
  }

  function sendAttack(from) {
    const to = other(from);
    from.pops.push({ text: "SALDIRI GÖNDERİLDİ", life: 1.3, x: 0.5, y: from.blocks.length + 1.5, c: "#ffd34d" });
    tone(300, 0.25, "sawtooth", 0.05, 900);
    if (cfg.layout === "online") { from.atk++; pushPresence(true); }
    else receiveAttack(to);
  }
  function receiveAttack(p) {
    p.boostT = BOOST_TIME; p.attackFlash = 1;
    p.pops.push({ text: "VİNÇ HIZLANDI!", life: 1.3, x: 0.5, y: p.blocks.length + 1.5, c: "#ff6b78" });
    alarm(); buzz([30, 40, 30]);
  }

  function drop(p) {
    const top = p.blocks[p.blocks.length - 1];
    const c = p.cur;
    const n = p.blocks.length;
    if (Math.abs(c.x - top.x) < PERFECT) {
      p.combo++;
      let x = top.x, w = top.w;
      if (p.combo >= 3 && w < BASE_W) { const g = Math.min(0.03, BASE_W - w); x -= g / 2; w += g; }
      p.blocks.push({ x, w });
      p.rings.push({ x: x + w / 2, w, y: n, life: 1 });
      p.pops.push({ text: p.combo > 1 ? "KUSURSUZ ×" + p.combo : "KUSURSUZ", life: 1, x: x + w / 2, y: n + 1.2, c: p.light });
      ding(p.combo); buzz(15);
      addDust(p, { x, w }, n);
      if (p.combo % ATTACK_EVERY === 0) sendAttack(p);
    } else {
      const l = Math.max(c.x, top.x), r = Math.min(c.x + c.w, top.x + top.w);
      if (r - l <= 0) { miss(p); return; }
      p.combo = 0;
      p.blocks.push({ x: l, w: r - l });
      if (c.x < top.x) p.debris.push({ x: c.x, w: top.x - c.x, y: n, vy: 0, vx: -0.1, rot: 0, vr: -2.4 });
      else p.debris.push({ x: r, w: c.x + c.w - r, y: n, vy: 0, vx: 0.1, rot: 0, vr: 2.4 });
      thud();
      addDust(p, { x: l, w: r - l }, n);
    }
    saveRecord(floors(p));
    spawn(p);
    if (cfg.layout === "online") pushPresence(true);
  }

  function miss(p) {
    const c = p.cur, n = p.blocks.length;
    p.debris.push({ x: c.x, w: c.w, y: n, vy: 0, vx: c.dir * 0.12, rot: 0, vr: c.dir * 2.2 });
    p.shake = 1; p.combo = 0;
    crash(); buzz([40, 40, 90]);
    if (cfg.mode === "timed") {
      const lose = Math.min(2, floors(p));
      for (let i = 0; i < lose; i++) {
        const b = p.blocks.pop();
        p.debris.push({ x: b.x, w: b.w, y: p.blocks.length, vy: -1 - i, vx: (Math.random() - 0.5) * 0.2, rot: 0, vr: (Math.random() - 0.5) * 4 });
      }
      p.pops.push({ text: lose ? "−" + lose + " KAT" : "ISKA", life: 1.2, x: 0.5, y: p.blocks.length + 1.5, c: "#ff6b78" });
      spawn(p);
    } else {
      p.alive = false;
      saveRecord(floors(p));
    }
    if (cfg.layout === "online") pushPresence(true);
    else checkLocalOver();
  }

  function checkLocalOver() {
    if (cfg.mode === "classic" && P.every(q => !q.alive)) endGame("");
  }

  function endGame(note) {
    if (state === "over") return;
    state = "over"; overAt = clock; overNote = note || "";
    P.forEach(q => { q.ready = false; saveRecord(floors(q)); });
    tone(392, 0.2, "triangle", 0.07); tone(523, 0.2, "triangle", 0.07, null, 0.15); tone(784, 0.35, "triangle", 0.07, null, 0.3);
    if (cfg.layout === "online") { me().ready = false; pushPresence(true); }
    updateRecordLine();
  }

  let wakeLock = null;
  function keepAwake() {
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
  }

  function startRound() {
    P.forEach(resetPlayer);
    state = "countdown"; countdown = 3.6; timeLeft = TIMED_SECONDS; overNote = "";
    keepAwake();
  }

  function tap(p) {
    ensureAudio();
    if (screen !== "game") return;
    if (state === "ready" || (state === "over" && clock - overAt > 0.9)) {
      if (cfg.layout === "online") {
        if (!me().ready) { me().ready = true; tone(440, 0.08, "square", 0.05); pushPresence(true); }
        return;
      }
      if (!p.ready) { p.ready = true; tone(440, 0.08, "square", 0.05); }
      if (P.every(q => q.ready)) startRound();
    } else if (state === "play" && p.alive && !p.remote && !(cfg.mode === "timed" && timeLeft <= 0)) {
      drop(p);
    }
  }

  // =====================================================================
  //  Online (claude.ai "room" yeteneği)
  // =====================================================================
  const net = { api: null, apiP: null, room: null, code: "", host: false, r: 0, lastAtk: 0, oppSeen: 0, lastSend: 0, doneAt: 0, prevN: 0, prevSt: "" };
  const me = () => P[0];
  const ROOM_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

  function getRoomApi() {
    if (!net.apiP) {
      const use = window.claude && window.claude.use;
      net.apiP = use ? Promise.resolve(window.claude.use("room")).catch(() => null) : Promise.resolve(null);
      net.apiP.then(a => { net.api = a; });
    }
    return net.apiP;
  }

  // İki taşıma yolu: claude.ai içinde "room" yeteneği, normal web sitesinde PeerJS (WebRTC, hesap gerekmez).
  function canPeer() { return !(window.claude && window.claude.use) && typeof RTCPeerConnection !== "undefined"; }
  function newCode() { let c = ""; for (let i = 0; i < 4; i++) c += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)]; return c; }

  function wrapRoom(nr) {
    const t = {
      kind: "room",
      send(d) { nr.presence(d).catch(() => {}); },
      opp() {
        let peers;
        try { peers = nr.peers(); } catch (e) { return null; }
        for (const p of peers) {
          if (p.sameTab || p.kind !== "viewer") continue;
          const pr = p.presence;
          if (pr && pr.v === 1) return pr;
        }
        return null;
      },
      leave() { return nr.leave(); },
    };
    nr.onPeers(() => updateRoomStatus(), () => { if (net.room === t) { net.room = null; setRoomStatus("Bağlantı koptu. Odaya yeniden katılın."); refreshMenu(); } });
    return t;
  }

  let peerLibP = null;
  function loadPeerJS() {
    if (window.Peer) return Promise.resolve();
    if (!peerLibP) peerLibP = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js";
      sc.onload = () => res();
      sc.onerror = () => { peerLibP = null; rej({ code: "load" }); };
      document.head.appendChild(sc);
    });
    return peerLibP;
  }

  async function peerTransport(code, host) {
    await loadPeerJS();
    const hostId = "kule-yarisi-" + code.toLowerCase();
    return new Promise((resolve, reject) => {
      const peer = host ? new window.Peer(hostId, { debug: 0 }) : new window.Peer({ debug: 0 });
      const t = {
        kind: "peer", conn: null, last: null, lastAt: 0,
        send(d) { if (t.conn && t.conn.open) { try { t.conn.send(d); } catch (e) {} } },
        opp() { return t.last && performance.now() - t.lastAt < 3500 ? t.last : null; },
        leave() { t.closed = true; try { peer.destroy(); } catch (e) {} },
      };
      let settled = false;
      const fail = code => { if (settled) return; settled = true; try { peer.destroy(); } catch (e) {} reject({ code }); };
      function attach(conn) {
        if (t.conn && t.conn !== conn) { try { t.conn.close(); } catch (e) {} }
        t.conn = conn;
        conn.on("open", () => { if (!settled) { settled = true; resolve(t); } pushPresence(true); updateRoomStatus(); });
        conn.on("data", d => {
          if (!d || typeof d !== "object" || d.v !== 1) return;
          const first = !t.opp();
          t.last = d; t.lastAt = performance.now();
          if (first) updateRoomStatus();
        });
        conn.on("close", () => { if (t.conn === conn) t.conn = null; t.last = null; updateRoomStatus(); });
        conn.on("error", () => {});
      }
      peer.on("open", () => {
        if (host) { settled = true; resolve(t); return; }
        attach(peer.connect(hostId, { reliable: true, serialization: "json" }));
        setTimeout(() => fail("timeout"), 15000);
      });
      peer.on("connection", c => { if (host) attach(c); else c.close(); });
      peer.on("error", e => { if (!settled) fail((e && e.type) || "error"); });
      peer.on("disconnected", () => { if (!t.closed) { try { peer.reconnect(); } catch (e) {} } });
    });
  }

  function joinError(e) {
    const c = (e && (e.code || e.type)) || "error";
    if (c === "peer-unavailable" || c === "timeout") return "Bu kodla açık bir oda bulunamadı. Kodu kontrol et; odayı kuranın oyunu açık olmalı.";
    if (c === "unavailable-id") return "Bu kod şu an kullanımda. Tekrar Oda kur'a bas.";
    if (c === "load") return "Online bileşeni yüklenemedi. İnternet bağlantını kontrol et.";
    if (c === "network" || c === "server-error" || c === "socket-error" || c === "socket-closed") return "Bağlantı sunucusuna ulaşılamadı. İnternetini kontrol edip tekrar dene.";
    if (c === "browser-incompatible") return "Bu tarayıcı online modu desteklemiyor. Chrome ya da Safari'nin güncel sürümünü dene.";
    return "Odaya bağlanılamadı (" + c + "). Biraz sonra tekrar dene.";
  }

  async function joinRoom(code, host, retried) {
    code = (code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    if (code.length !== 4) { setRoomStatus("Kod 4 karakter olmalı."); return; }
    setRoomStatus("Bağlanıyor…");
    if (net.room) { const old = net.room; net.room = null; try { await old.leave(); } catch (e) {} }
    try {
      const api = await getRoomApi();
      if (api) net.room = wrapRoom(await api.join("kule-" + code.toLowerCase()));
      else if (canPeer()) net.room = await peerTransport(code, host);
      else { setRoomStatus("Online mod bu görünümde kullanılamıyor. Oyunu web adresinden (github.io) aç ya da claude.ai'de giriş yapmış olarak aç."); refreshMenu(); return; }
      net.code = code; net.host = host; net.r = 0; net.lastAtk = 0;
      me().ready = false;
      pushPresence(true);
      updateRoomStatus();
    } catch (e) {
      net.room = null;
      if (host && !retried && e && e.code === "unavailable-id") return joinRoom(newCode(), true, true);
      setRoomStatus(joinError(e));
    }
    refreshMenu();
  }
  async function leaveRoom() {
    const old = net.room;
    net.room = null; net.code = "";
    if (old) { try { await old.leave(); } catch (e) {} }
    setRoomStatus("Bir oda kur ve kodu arkadaşına söyle, ya da onun kodunu yazıp katıl.");
    refreshMenu();
  }

  function oppPeer() { return net.room ? net.room.opp() : null; }
  setInterval(() => { if (net.room && net.room.kind === "peer") pushPresence(true); }, 500);

  function stName() {
    if (screen !== "game") return "lobby";
    if (state === "ready") return "lobby";
    if (state === "countdown") return "cd";
    if (state === "over") return "over";
    if (cfg.mode === "classic" && !me().alive) return "dead";
    if (cfg.mode === "timed" && timeLeft <= 0) return "done";
    return "play";
  }

  function pushPresence(force) {
    if (!net.room) return;
    const now = performance.now();
    if (!force && now - net.lastSend < 66) return;
    net.lastSend = now;
    const p = me();
    const blocks = p.blocks || [];
    const off = Math.max(0, blocks.length - 26);
    const r4 = v => Math.round(v * 10000) / 10000;
    const data = {
      v: 1, st: stName(), ready: !!p.ready, r: net.r, mode: cfg.mode, host: net.host,
      n: floors(p), off, b: blocks.slice(off).map(b => [r4(b.x), r4(b.w)]),
      cx: p.cur ? r4(p.cur.x) : 0, cw: p.cur ? r4(p.cur.w) : BASE_W,
      combo: p.combo | 0, atk: p.atk | 0, tl: Math.max(0, Math.round(timeLeft * 10) / 10),
    };
    net.room.send(data);
  }

  function applyRemote(pr) {
    const o = P[1];
    o.remote = true;
    if (!pr) { o.present = false; return; }
    o.present = true;
    o.ready = !!pr.ready; o.st = pr.st; o.r = pr.r | 0; o.combo = pr.combo | 0;
    if (!net.host && pr.host && (pr.mode === "classic" || pr.mode === "timed") && pr.mode !== cfg.mode && (state === "ready" || state === "over")) {
      cfg.mode = pr.mode; refreshMenu();
    }
    const sameRound = o.r === net.r && (state === "countdown" || state === "play" || state === "over");
    if (!sameRound) { if (!o.blocks || (state === "ready" && o.blocks.length > 1)) resetPlayer(o); o.remote = true; o.ready = !!pr.ready; return; }
    const n = Math.max(0, pr.n | 0);
    const blocks = new Array(n + 1).fill(null);
    (Array.isArray(pr.b) ? pr.b : []).forEach((bb, i) => {
      const idx = (pr.off | 0) + i;
      if (idx <= n && Array.isArray(bb)) blocks[idx] = { x: +bb[0] || 0, w: Math.max(0, +bb[1] || 0) };
    });
    if (!blocks[0]) blocks[0] = { x: (1 - BASE_W) / 2, w: BASE_W };
    const prevN = o.blocks ? o.blocks.length - 1 : 0;
    if (state === "play" && o.blocks) {
      if (n === prevN + 1) {
        const top = o.blocks[prevN], nb = blocks[n];
        if (top && nb) {
          if (nb.w < top.w - 1e-4) {
            const cut = top.w - nb.w;
            if (nb.x > top.x + 1e-4) o.debris.push({ x: nb.x + nb.w, w: cut, y: n, vy: 0, vx: 0.1, rot: 0, vr: 2.4 });
            else o.debris.push({ x: nb.x - cut, w: cut, y: n, vy: 0, vx: -0.1, rot: 0, vr: -2.4 });
          } else {
            o.rings.push({ x: nb.x + nb.w / 2, w: nb.w, y: n, life: 1 });
            o.pops.push({ text: "KUSURSUZ", life: 1, x: nb.x + nb.w / 2, y: n + 1.2, c: o.light });
          }
          addDust(o, nb, n);
        }
      } else if (n < prevN) {
        for (let i = n + 1; i <= prevN; i++) { const b = o.blocks[i]; if (b) o.debris.push({ x: b.x, w: b.w, y: i - 1, vy: -1, vx: (Math.random() - 0.5) * 0.2, rot: 0, vr: (Math.random() - 0.5) * 4 }); }
        o.shake = 1;
      }
    }
    const wasAlive = o.alive;
    o.alive = pr.st !== "dead";
    if (wasAlive && !o.alive && o.cur) { o.debris.push({ x: o.cur.x, w: o.cur.w, y: n + 1, vy: 0, vx: 0.1, rot: 0, vr: 2.2 }); o.shake = 1; }
    o.blocks = blocks;
    o.cur = { x: +pr.cx || 0, w: +pr.cw || BASE_W, dir: 1 };
    if ((pr.atk | 0) > net.lastAtk) { const k = (pr.atk | 0) - net.lastAtk; net.lastAtk = pr.atk | 0; if (state === "play" && me().alive) for (let i = 0; i < Math.min(k, 1); i++) receiveAttack(me()); }
  }

  function onlineTick() {
    const pr = oppPeer();
    if (pr) net.oppSeen = clock;
    applyRemote(pr);
    const m = me(), o = P[1];
    if (state === "ready" || (state === "over" && clock - overAt > 0.9)) {
      if (m.ready && pr && pr.ready) {
        const oppIdle = pr.st === "lobby" || pr.st === "over";
        const oppStarted = (pr.st === "cd" || pr.st === "play") && (pr.r | 0) > net.r;
        if (oppIdle || oppStarted) {
          net.r = oppIdle ? Math.max(net.r, pr.r | 0) + 1 : (pr.r | 0);
          net.lastAtk = 0; net.doneAt = 0;
          startRound();
          P[1].remote = true;
          me().ready = true;
          pushPresence(true);
        }
      }
    }
    if (state === "countdown" || state === "play") {
      if (!pr && clock - net.oppSeen > 5) endGame("Rakibin bağlantısı koptu");
      if (state === "play" && pr && (pr.r | 0) === net.r) {
        const oppEnded = pr.st === "dead" || pr.st === "done" || pr.st === "over";
        if (cfg.mode === "classic" && !m.alive && oppEnded) endGame("");
        if (cfg.mode === "timed" && timeLeft <= 0) {
          if (!net.doneAt) net.doneAt = clock;
          if (oppEnded || clock - net.doneAt > 3) endGame("");
        }
      }
    }
    pushPresence(false);
  }

  // =====================================================================
  //  Güncelleme
  // =====================================================================
  function update(dt) {
    clock += dt;
    if (screen === "game") {
      if (state === "countdown") {
        const before = Math.ceil(countdown - 0.6);
        countdown -= dt;
        const after = Math.ceil(countdown - 0.6);
        if (after !== before) { if (after >= 1) tone(440, 0.12, "square", 0.05); else tone(880, 0.3, "square", 0.06); }
        if (countdown <= 0.6) state = "play";
      } else if (state === "play" && countdown > 0) countdown -= dt;

      if (state === "play" && cfg.mode === "timed" && timeLeft > 0) {
        const before = Math.ceil(timeLeft);
        timeLeft = Math.max(0, timeLeft - dt);
        if (Math.ceil(timeLeft) !== before && timeLeft <= 5 && timeLeft > 0) tone(1200, 0.06, "square", 0.04);
        if (timeLeft <= 0 && cfg.layout !== "online") endGame("Süre doldu");
      }
      if (cfg.layout === "online") onlineTick();
    }

    for (const p of P) {
      if (!p.blocks) continue;
      const placing = p.blocks.length;
      const wind = windAt(placing);
      if (p.alive && p.cur) {
        if (wind) {
          const gust = 0.55 + 0.45 * Math.sin(clock * 2.1 + placing) * Math.sin(clock * 0.7 + 1.3);
          p.sway += ((wind.dir * wind.s * gust * 0.11) - p.sway) * Math.min(1, dt * 3);
          if (state === "play" && !p.remote) p.cur.x += wind.dir * wind.s * gust * 0.09 * dt;
        } else p.sway *= Math.max(0, 1 - dt * 3);
        if (state === "play" && !p.remote && !(cfg.mode === "timed" && timeLeft <= 0)) {
          const c = p.cur;
          c.x += c.dir * speedOf(p) * dt;
          const min = -c.w * 0.25, max = 1 - c.w * 0.75;
          if (c.x < min) { c.x = min; c.dir = 1; }
          if (c.x > max) { c.x = max; c.dir = -1; }
        }
      }
      p.boostT = Math.max(0, p.boostT - dt);
      p.attackFlash = Math.max(0, p.attackFlash - dt * 0.8);
      const camT = Math.max(0, p.blocks.length + 2 - p.vf * 0.62);
      p.cam += (camT - p.cam) * Math.min(1, dt * 4.5);
      p.shake = Math.max(0, p.shake - dt * 2.5);
      for (const d of p.debris) { d.vy += 36 * dt; d.y -= d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt; }
      p.debris = p.debris.filter(d => d.y > p.cam - 14);
      for (const s of p.pops) { s.life -= dt * 0.85; s.y += dt * 0.9; }
      p.pops = p.pops.filter(s => s.life > 0);
      for (const q of p.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 1.2 * dt; q.vx *= 0.96; q.life -= dt; }
      p.parts = p.parts.filter(q => q.life > 0);
      for (const g of p.rings) g.life -= dt * 1.6;
      p.rings = p.rings.filter(g => g.life > 0);
      // rüzgâr çizgileri
      if (wind && p.alive) {
        if (p.streaks.length < 18 * wind.s && Math.random() < dt * 22 * wind.s) p.streaks.push({ x: wind.dir > 0 ? -0.2 : 1.2, y: Math.random(), l: 0.06 + Math.random() * 0.12, v: (0.6 + Math.random() * 0.6) * wind.dir * (0.6 + wind.s), a: 0.15 + Math.random() * 0.25 });
      }
      for (const s of p.streaks) s.x += s.v * dt;
      p.streaks = p.streaks.filter(s => s.x > -0.4 && s.x < 1.4);
    }
  }

  // =====================================================================
  //  Çizim
  // =====================================================================
  function views() {
    if (cfg.layout === "side") return [{ p: P[0], x: 0, y: 0, w: W / 2, h: H, flip: false }, { p: P[1], x: W / 2, y: 0, w: W / 2, h: H, flip: false }];
    if (cfg.layout === "online") {
      const oh = Math.round(H * 0.4);
      return [{ p: P[0], x: 0, y: oh, w: W, h: H - oh, flip: false }, { p: P[1], x: 0, y: 0, w: W, h: oh, flip: false, remote: true }];
    }
    return [{ p: P[0], x: 0, y: H / 2, w: W, h: H / 2, flip: false }, { p: P[1], x: 0, y: 0, w: W, h: H / 2, flip: true }];
  }

  function drawFloor(p, x, y, w, h, idx, night) {
    if (w < 0.5) return;
    if (idx === 0) {
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, "#d8d2c6"); g.addColorStop(1, "#8e897f");
      ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = css(mixRGB(hex("#2b3644"), hex("#ffd58a"), night * 0.6)); ctx.fillRect(x + w * 0.1, y + h * 0.28, w * 0.8, h * 0.42);
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      for (let i = 1; i < 6; i++) ctx.fillRect(x + w * 0.1 + (w * 0.8 / 6) * i, y + h * 0.28, 1, h * 0.42);
      ctx.fillStyle = p.accent; ctx.fillRect(x, y, w, Math.max(2, h * 0.1));
      hazard(x, y + h * 0.78, w, h * 0.16, "#22252b", "#f4b400");
      return;
    }
    const slab = Math.max(2, h * 0.2), gh = h - slab;
    const g = ctx.createLinearGradient(0, y, 0, y + gh);
    g.addColorStop(0, p.g0); g.addColorStop(0.5, p.g1); g.addColorStop(1, p.g2);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, gh);
    if (night > 0) { ctx.fillStyle = "rgba(6,10,28," + (night * 0.62) + ")"; ctx.fillRect(x, y, w, gh); }
    // gökyüzü yansıması
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, gh); ctx.clip();
    const rx = x + (hash(idx, 7) * 1.4 - 0.2) * w;
    ctx.fillStyle = "rgba(255,255,255," + (0.16 * (1 - night * 0.6)) + ")";
    ctx.beginPath(); ctx.moveTo(rx, y + gh); ctx.lineTo(rx + gh * 0.7, y); ctx.lineTo(rx + gh * 0.7 + w * 0.08, y); ctx.lineTo(rx + w * 0.08, y + gh); ctx.fill();
    ctx.restore();
    // paneller
    const nP = Math.max(1, Math.round(w / Math.max(8, h * 0.62)));
    const step = w / nP;
    if (night > 0.25) {
      for (let i = 0; i < nP; i++) {
        if (hash(idx, i) < 0.5) {
          ctx.fillStyle = "rgba(255,212,140," + Math.min(0.9, (night - 0.25) * 1.4) + ")";
          ctx.fillRect(x + i * step + 1.5, y + 1.5, step - 3, gh - 3);
        }
      }
    }
    ctx.fillStyle = "rgba(10,18,28,0.38)";
    for (let i = 1; i < nP; i++) ctx.fillRect(x + i * step - 0.75, y, 1.5, gh);

  function lattice(x1, y1, x2, y2, depth, vertical) {
    // iki paralel kiriş ve zikzak dikmeler
    ctx.beginPath();

      ctx.moveTo(x1 - depth / 2, y1); ctx.lineTo(x1 - depth / 2, y2);

  function panel(V, lines, accent, area) {
    const VW = V.w;

    ctx.fillStyle = accent; rr(x + 18, y, pw - 36, 3, 2); ctx.fill();
    let yy = y + 17;
    for (const l of lines) {
      const h = l.s * (l.gap || 1.32);
      const size = fit(l.t, pw - 32, l.s, l.f, l.w);
      txt(l.t, cx, yy + h / 2, size, l.c || "#f3efe7", { f: l.f, w: l.w, a: l.a, ls: l.ls });

  function drawView(V) {
    const p = V.p, o = other(p);
    const VW = V.w, VH = V.h;
    ctx.save();
    ctx.translate(V.x, V.y);
    if (V.flip) { ctx.translate(VW, VH); ctx.rotate(Math.PI); }
    ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
    if (p.shake > 0) ctx.translate((Math.random() - 0.5) * 10 * p.shake, (Math.random() - 0.5) * 6 * p.shake);

    const HUD = Math.round(Math.max(54, Math.min(80, VH * 0.12)));
    const BH = Math.max(14, (VH - HUD) / 10.5);
    const site = BH * 0.9;
    const base0 = VH - HUD - site;              // kamera 0'da zemin yüzeyi
    p.vf = base0 / BH;
    const n = floors(p);
    const camPx = (p.cam || 0) * BH;
    const groundY = base0 + camPx;
    const t = Math.min(1, (p.cam || 0) / 34);   // irtifa → gün batımı → gece
    const night = Math.max(0, Math.min(1, (t - 0.45) / 0.45));
    const area = VH - HUD;

    // --- gökyüzü
    const top = ramp(SKY_TOP, t), bot = ramp(SKY_BOT, t);
    const g = ctx.createLinearGradient(0, 0, 0, area);
    g.addColorStop(0, css(top)); g.addColorStop(1, css(bot));
    ctx.fillStyle = g; ctx.fillRect(-20, -20, VW + 40, VH + 40);

    if (night > 0) {
      for (const s of stars) {
        const a = night * (0.55 + 0.45 * Math.sin(clock * 1.5 + s.tw));
        ctx.fillStyle = "rgba(255,255,255," + a + ")";
        ctx.fillRect(s.x * VW, s.y * area * 0.85, s.s, s.s);
      }
    }
    // güneş / ay
    const sunY = area * (0.16 + t * 1.05), sunX = VW * 0.8, sr = Math.max(14, Math.min(VW, VH) * 0.06);
    if (sunY < area + sr) {
      const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sr * 4);
      sg.addColorStop(0, "rgba(255,240,200,0.55)"); sg.addColorStop(1, "rgba(255,200,120,0)");
      ctx.fillStyle = sg; ctx.fillRect(sunX - sr * 4, sunY - sr * 4, sr * 8, sr * 8);
      ctx.fillStyle = css(mixRGB(hex("#fff6dc"), hex("#ff9a5c"), Math.min(1, t * 1.6)));

    }

      ctx.fillStyle = "#f4f1e6"; ctx.beginPath(); ctx.arc(mx, my, sr * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = css(top); ctx.beginPath(); ctx.arc(mx + sr * 0.35, my - sr * 0.15, sr * 0.7, 0, Math.PI * 2); ctx.fill();

    // --- şehir siluetleri (paralaks)

      ctx.fillStyle = gg; ctx.fillRect(0, groundY, VW, site + HUD + 4);
      // perde duvar
      const hoardH = BH * 0.55;
      ctx.fillStyle = css(mixRGB(hex("#34495a"), hex("#1a2130"), night)); ctx.fillRect(0, groundY - hoardH, VW, hoardH);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      for (let x = 0; x < VW; x += Math.max(24, VW / 12)) ctx.fillRect(x, groundY - hoardH, 1, hoardH);
      hazard(0, groundY - hoardH, VW, Math.max(3, hoardH * 0.16), "#1c1f24", "#f4b400");

      if (showCrane) {

        const jibY = blockY - BH * 2.5;

        const jd = Math.max(7, BH * 0.36);

        ctx.strokeStyle = crane; ctx.lineWidth = lw;

        ctx.beginPath(); ctx.moveTo(mastX - mastW / 2, jibY - jd); ctx.lineTo(mastX, apexY); ctx.lineTo(mastX + mastW / 2, jibY - jd); ctx.stroke();
        ctx.strokeStyle = "rgba(30,30,30,0.6)";
        ctx.beginPath(); ctx.moveTo(mastX, apexY); ctx.lineTo(VW * 0.62, jibY - jd); ctx.moveTo(mastX, apexY); ctx.lineTo(mastX - VW * 0.15, jibY - jd); ctx.stroke();
        // karşı ağırlık ve kabin
        ctx.fillStyle = css(mixRGB(hex("#6f7480"), hex("#2d3140"), night)); ctx.fillRect(mastX - VW * 0.15, jibY - jd * 0.3, VW * 0.07, jd * 1.6);
        ctx.fillStyle = crane; rr(mastX + mastW / 2, jibY + 1, mastW * 1.6, jd * 1.2, 2); ctx.fill();
        ctx.fillStyle = night > 0.4 ? "#ffe3a0" : "#2f4a63"; ctx.fillRect(mastX + mastW / 2 + 3, jibY + 3, mastW * 1.6 - 6, jd * 0.6);
        if (night > 0.3) { ctx.fillStyle = (Math.sin(clock * 4) > 0) ? "#ff3b3b" : "#5a1010"; ctx.beginPath(); ctx.arc(VW - 6, jibY - jd, 2.5, 0, Math.PI * 2); ctx.fill(); }
        // araba
        const tx = (c.x + c.w / 2) * VW;
        ctx.fillStyle = "#2a2d33"; rr(tx - 10, jibY - 2, 20, 7, 2); ctx.fill();
        // salınım

    }

            ? [{ t: "RAKİP BAĞLANDI", s: big * 0.8, f: DISP, w: "400", c: p.accent }, { t: pr.ready ? "HAZIR ✓" : "Hazırlanıyor…", s: mid, c: pr.ready ? p.light : "#f3efe7", a: pr.ready ? 1 : pulse }]
            : [{ t: "RAKİP BEKLENİYOR", s: big * 0.8, f: DISP, w: "400", c: p.accent }, { t: "Oda kodu: " + net.code, s: mid, ls: "2px" }, { t: "Arkadaşın Online → Katıl ile bu kodu girsin", s: small, w: "600", c: "#a3a9b8" }], p.accent, area);
        } else {
          panel(V, [
            { t: cfg.layout === "online" ? "HAZIR MISIN?" : p.name, s: big, f: DISP, w: "400", c: p.accent },
            { t: "Blok tam alttakinin üstüne gelince dokun.", s: small, w: "600" },
            { t: modeLine, s: small, w: "600", c: "#a3a9b8" },
            { t: p.ready ? "HAZIR ✓  RAKİP BEKLENİYOR" : "HAZIRSAN DOKUN", s: mid, c: p.ready ? p.light : "#f3efe7", a: p.ready ? 1 : pulse, gap: 1.6, ls: "1px" },
          ], p.accent, area);
        }
      } else if (state === "countdown" || (state === "play" && countdown > 0)) {
        const k = Math.ceil(countdown - 0.6);
        const lbl = k >= 1 ? String(k) : "BAŞLA!";
        const sc = 1 + ((countdown - 0.6) % 1 + 1) % 1 * 0.25;
        txt(lbl, VW / 2, area * 0.45, Math.round(big * 2 * sc), "#ffffff", { f: DISP, w: "400", stroke: 8, a: 0.95 });
      } else if (state === "play" && !p.alive) {
        const on = floors(o);
        const lead = n - on;
        panel(V, [
          { t: "KULE ÇÖKTÜ", s: big, f: DISP, w: "400", c: p.accent },
          { t: n + " kat · " + meters(n) + " m", s: mid },
          { t: o.alive ? (lead > 0 ? "Rakibin seni geçmek için " + (lead + 1) + " kat daha yapmalı" : "Rakip önde, bitirmesini bekle") : "Bekleniyor…", s: small, w: "600", c: "#a3a9b8" },
        ], p.accent, area);
      } else if (state === "play" && cfg.mode === "timed" && timeLeft <= 0 && !V.remote) {
        panel(V, [{ t: "SÜRE DOLDU", s: big, f: DISP, w: "400", c: p.accent }, { t: "Rakip bekleniyor…", s: small, w: "600", c: "#a3a9b8" }], p.accent, area);
      } else if (state === "play" && !o.alive && n > floors(o) && cfg.mode === "classic") {
        txt("ÖNDESİN · DEVAM ET", VW / 2, area - 22, Math.round(mid * 0.8), p.light, { a: pulse, stroke: 4, ls: "1px" });
      } else if (state === "over") {
        const a = n, b = floors(o);
        const res = a > b ? "KAZANDIN!" : a < b ? "KAYBETTİN" : "BERABERE";
        const col = a > b ? p.light : a < b ? "#ff9aa4" : "#f3efe7";
        const canTap = clock - overAt > 0.9;
        const lines = [];
        if (overNote) lines.push({ t: overNote.toUpperCase(), s: small, c: "#a3a9b8", ls: "1px" });
        if (cfg.layout === "online" && V.remote) {
          lines.push({ t: a > b ? "RAKİP KAZANDI" : a < b ? "RAKİP KAYBETTİ" : "BERABERE", s: big * 0.8, f: DISP, w: "400", c: p.accent });
          lines.push({ t: a + " kat", s: mid });
          const pr = oppPeer();
          if (pr) lines.push({ t: pr.ready ? "TEKRAR İÇİN HAZIR ✓" : "Karar veriyor…", s: small, c: pr.ready ? p.light : "#a3a9b8" });
        } else {
          lines.push({ t: res, s: big, f: DISP, w: "400", c: col });
          lines.push({ t: a + " kat  —  " + b + " kat", s: mid });
          lines.push({ t: "Rekor (" + (cfg.mode === "timed" ? "60 sn" : "klasik") + "): " + records[cfg.mode] + " kat", s: small, w: "600", c: "#a3a9b8" });
          lines.push({ t: p.ready ? "HAZIR ✓  RAKİP BEKLENİYOR" : canTap ? "TEKRAR İÇİN DOKUN" : " ", s: mid, c: p.ready ? p.light : "#f3efe7", a: p.ready ? 1 : pulse, gap: 1.6, ls: "1px" });
        }
        panel(V, lines, col, area);
      }
    }
    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#0d1018"; ctx.fillRect(0, 0, W, H);
    const vs = views();
    for (const V of vs) drawView(V);
    // ayırıcı
    if (cfg.layout === "side") {
      ctx.fillStyle = "#15171c"; ctx.fillRect(W / 2 - 3, 0, 6, H);
      ctx.fillStyle = "#f4b400";
      for (let y = 0; y < H; y += 18) ctx.fillRect(W / 2 - 3, y, 6, 9);
    }
    else { const y = cfg.layout === "online" ? Math.round(H * 0.4) : H / 2; hazard(0, y - 3, W, 6, "#15171c", "#f4b400"); }
  }

  // =====================================================================
  //  Giriş
  // =====================================================================
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (screen !== "game") return;
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (cfg.layout === "online") tap(P[0]);
    else if (cfg.layout === "side") tap(x < W / 2 ? P[0] : P[1]);
    else tap(y < H / 2 ? P[1] : P[0]);
  });
  cv.addEventListener("contextmenu", e => e.preventDefault());
  window.addEventListener("keydown", e => {
    if (screen !== "game" || e.repeat) return;
    if (e.target && e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (cfg.layout === "online") { if (k === " " || k === "enter" || k === "a" || k === "l") { e.preventDefault(); tap(P[0]); } return; }
    const leftTop = cfg.layout === "side" ? P[0] : P[1];
    const rightBottom = cfg.layout === "side" ? P[1] : P[0];
    if (k === "a" || k === " ") { e.preventDefault(); tap(leftTop); }
    if (k === "l" || k === "enter") { e.preventDefault(); tap(rightBottom); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && screen === "game") keepAwake();
  });

  // =====================================================================
  //  Menü
  // =====================================================================
  const menuEl = $("#menu"), menuBtn = $("#menuBtn"), onlineBox = $("#onlineBox");
  function setRoomStatus(html) { $("#roomStatus").textContent = html; }
  function updateRoomStatus() {
    if (!net.room) return;
    const el = $("#roomStatus");
    el.textContent = "";
    const b = document.createElement("div");
    b.className = "code"; b.textContent = net.code;
    const s = document.createElement("span");
    const opp = oppPeer();
    if (opp && opp.host && !net.host && (opp.mode === "classic" || opp.mode === "timed") && opp.mode !== cfg.mode) {
      cfg.mode = opp.mode;
      for (const o of document.querySelectorAll('[data-group="mode"] .opt')) o.setAttribute("aria-pressed", String(o.dataset.value === cfg.mode));
    }
    s.textContent = opp
      ? "Rakip bağlandı ✓  Mod: " + (cfg.mode === "timed" ? "60 Saniye" : "Klasik") + (net.host ? "" : " (odayı kuran seçer)")
      : (net.host ? "Arkadaşın Online → kodu yazıp Katıl'a bassın. Rakip bekleniyor…" : "Odaya girdin. Rakip bekleniyor…");
    el.append(b, s);
  }
  function refreshMenu() {
    for (const seg of document.querySelectorAll(".seg")) {
      const key = seg.dataset.group;
      for (const b of seg.querySelectorAll(".opt")) b.setAttribute("aria-pressed", String(cfg[key] === b.dataset.value));
    }
    const online = cfg.layout === "online";
    onlineBox.hidden = !online;
    $("#leaveRoom").hidden = !net.room;
    $("#mkRoom").hidden = !!net.room; $("#joinRoom").hidden = !!net.room; $("#code").hidden = !!net.room;
    $("#play").disabled = online && !net.room;
    const modeLocked = online && net.room && !net.host;
    for (const b of document.querySelectorAll('[data-group="mode"] .opt')) b.disabled = !!modeLocked;
    if (net.room) updateRoomStatus();
    updateRecordLine();
  }
  function updateRecordLine() {
    $("#recordLine").textContent = "Rekor: " + records.classic + " kat · 60 sn: " + records.timed + " kat";
  }
  for (const seg of document.querySelectorAll(".seg")) {
    seg.addEventListener("click", e => {
      const b = e.target.closest(".opt");
      if (!b || b.disabled) return;
      cfg[seg.dataset.group] = b.dataset.value;
      store.set(seg.dataset.group, b.dataset.value);
      if (seg.dataset.group === "layout" && b.dataset.value !== "online" && net.room) leaveRoom();
      if (seg.dataset.group === "layout" && b.dataset.value === "online") getRoomApi();
      if (net.room) pushPresence(true);
      refreshMenu();
      P.forEach(resetPlayer);
      placeMenuBtn();
    });
  }
  $("#mkRoom").addEventListener("click", () => {
    ensureAudio();
    joinRoom(newCode(), true);
  });
  $("#joinRoom").addEventListener("click", () => { ensureAudio(); joinRoom($("#code").value, false); });
  $("#code").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); joinRoom($("#code").value, false); } });
  $("#leaveRoom").addEventListener("click", leaveRoom);
  $("#play").addEventListener("click", () => {
    ensureAudio();
    screen = "game"; state = "ready";
    P.forEach(resetPlayer);
    if (cfg.layout === "online") { P[1].remote = true; pushPresence(true); }
    menuEl.hidden = true; menuBtn.hidden = false;
    placeMenuBtn();
    keepAwake();
  });
  menuBtn.addEventListener("click", () => {
    screen = "menu"; state = "ready";
    P.forEach(resetPlayer);
    if (cfg.layout === "online") { me().ready = false; pushPresence(true); }
    menuEl.hidden = false; menuBtn.hidden = true;
    refreshMenu();
    try { wakeLock && wakeLock.release(); } catch (e) {}
  });
  function placeMenuBtn() {
    const s = menuBtn.style;
    s.left = s.top = s.right = s.transform = "";
    if (cfg.layout === "face") { s.left = "50%"; s.top = "50%"; s.transform = "translate(-50%,-50%)"; }
    else if (cfg.layout === "side") { s.left = "50%"; s.top = "calc(10px + env(safe-area-inset-top, 0px))"; s.transform = "translateX(-50%)"; }
    else { s.left = "50%"; s.top = Math.round(H * 0.4) + "px"; s.transform = "translate(-50%,-50%)"; }
  }

  // =====================================================================
  //  Döngü
  // =====================================================================
  resize();
  P.forEach(resetPlayer);
  refreshMenu();
  if (cfg.layout === "online") getRoomApi();

  // Menü arkasında canlı bir sahne: iki kule kendi kendine yükselir.
  const demo = { t: 0 };
  function demoTick(dt) {
    demo.t += dt;
    if (demo.t > 0.9) {
      demo.t = 0;
      for (const p of P) {
        if (p.blocks.length > 40) resetPlayer(p);
        const top = p.blocks[p.blocks.length - 1];
        const off = (Math.random() - 0.5) * 0.02;
        const w = Math.max(0.2, top.w - Math.abs(off));
        p.blocks.push({ x: top.x + (off > 0 ? off : 0), w });
        spawn(p);
      }
    }
    for (const p of P) if (p.cur) { p.cur.x = 0.5 - p.cur.w / 2 + Math.sin(clock * 1.3 + (p === P[0] ? 0 : 2)) * 0.25; }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (screen === "menu") demoTick(dt);
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
