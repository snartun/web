<title>Top Yağmuru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen WebGL table; outlined arcade type floats over it; sheets slide up from the bottom. */
:root {
  --bg: #ff86c1;
  --ink: #23205e;
  --ink-soft: #6a6a9a;
  --blue: #4a7bff;
  --blue-d: #2c4fd6;
  --go: #3ee07a;
  --go-d: #1c9f4e;
  --gold: #ffc928;
  --gold-d: #e09400;
  --pink: #ff4fa3;
  --bad: #ff4d5e;
  --card: #ffffff;
  --card-2: #eef2ff;
  --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --o: 0 4px 0 var(--ink), 2.5px 0 0 var(--ink), -2.5px 0 0 var(--ink), 0 2.5px 0 var(--ink), 0 -2.5px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
  --o-sm: 0 2px 0 var(--ink), 1.5px 0 0 var(--ink), -1.5px 0 0 var(--ink), 0 1.5px 0 var(--ink), 0 -1.5px 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink);
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 600;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .6s;
}
#app { position: relative; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* floating world labels */
.lbl {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  color: #fff; font-weight: 700; font-size: 22px; white-space: nowrap; text-shadow: var(--o-sm);
  font-variant-numeric: tabular-nums; will-change: transform;
}
.lbl.cup { font-size: 24px; }
.lbl.cup.met { color: #c9ffd9; }
.lbl.tag { font-size: 13px; letter-spacing: .08em; opacity: .9; }
.pop {
  position: absolute; left: 0; top: 0; color: #fff; font-weight: 700; font-size: 30px; white-space: nowrap;
  text-shadow: 0 3px 0 #0d6b33, 2px 0 0 #0d6b33, -2px 0 0 #0d6b33, 0 2px 0 #0d6b33, 0 -2px 0 #0d6b33, 1.5px 1.5px 0 #0d6b33, -1.5px 1.5px 0 #0d6b33, 1.5px -1.5px 0 #0d6b33, -1.5px -1.5px 0 #0d6b33;
  animation: popup .85s ease-out forwards;
}
.pop.gold { color: var(--gold); font-size: 20px; text-shadow: var(--o-sm); }
@keyframes popup {
  0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
  18% { transform: translate(-50%, -80%) scale(1.25); opacity: 1; }
  100% { transform: translate(-50%, -230%) scale(.9); opacity: 0; }
}
.praise {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  font-weight: 700; font-size: clamp(44px, 13vw, 76px); color: #fff; white-space: nowrap; letter-spacing: .01em;
  text-shadow: 0 7px 0 #b0126a, 4px 0 0 #b0126a, -4px 0 0 #b0126a, 0 4px 0 #b0126a, 0 -4px 0 #b0126a, 3px 3px 0 #b0126a, -3px 3px 0 #b0126a, 3px -3px 0 #b0126a, -3px -3px 0 #b0126a, 0 12px 24px rgba(120,0,60,.35);
  background: none;
  animation: praise 1.4s cubic-bezier(.2,1.4,.4,1) forwards;
}
.praise.big { color: var(--gold); text-shadow: 0 7px 0 #8a4a00, 4px 0 0 #8a4a00, -4px 0 0 #8a4a00, 0 4px 0 #8a4a00, 0 -4px 0 #8a4a00, 3px 3px 0 #8a4a00, -3px 3px 0 #8a4a00, 3px -3px 0 #8a4a00, -3px -3px 0 #8a4a00; }
@keyframes praise {
  0% { transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0; }
  25% { transform: translate(-50%, -50%) scale(1.08) rotate(2deg); opacity: 1; }
  75% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(-50%, -70%) scale(1.05); opacity: 0; }
}

/* HUD */
.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding-block: 12px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud .r { justify-self: end; display: flex; gap: 8px; align-items: center; }
.lvl { justify-self: start; color: #fff; font-weight: 700; font-size: 22px; text-shadow: var(--o-sm); letter-spacing: .02em; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.45); box-shadow: 0 0 0 2.5px var(--ink); display: block; }
.dots i.on { background: #fff; transform: scale(1.15); }
.dots i.done { background: var(--go); }
.coins {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 4px;
  background: rgba(35, 32, 94, .55); border-radius: 999px; color: #fff; font-weight: 700; font-size: 17px;
  font-variant-numeric: tabular-nums;
}
.coin {
  width: 26px; height: 26px; border-radius: 50%; flex: none; display: inline-grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff6b0 0 15%, var(--gold) 45%, var(--gold-d) 100%);
  box-shadow: inset 0 -2px 0 rgba(140,70,0,.35), 0 0 0 2px #fff;
}
.coin::after { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(160,90,0,.55); }
.coin.sm { width: 18px; height: 18px; box-shadow: inset 0 -1.5px 0 rgba(140,70,0,.35); }
.coin.sm::after { width: 6px; height: 6px; border-width: 1.5px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 14px; border: 0; padding: 0; cursor: pointer;
  background: rgba(35, 32, 94, .55); color: #fff; display: grid; place-items: center;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:focus-visible, .btn:focus-visible, .toggle:focus-visible, .buy:focus-visible, .round:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

.goal {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(62px + env(safe-area-inset-top, 0px));
  width: min(300px, calc(100% - 28px)); text-align: center; pointer-events: none;
}
.goal-num { color: #fff; font-weight: 700; font-size: 34px; line-height: 1; text-shadow: var(--o); font-variant-numeric: tabular-nums; }
.goal-num small { font-size: 20px; opacity: .95; }
.goal-sub { color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-shadow: var(--o-sm); margin-top: 4px; }
.bar-wrap { position: relative; margin-top: 12px; }
.bar { height: 18px; border-radius: 999px; background: rgba(35,32,94,.5); box-shadow: 0 0 0 3px #fff, 0 4px 0 3px var(--ink); overflow: hidden; position: relative; }
.bar span { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(180deg, #8dffb0, var(--go) 50%, var(--go-d)); transition: width .15s; }
.marks { position: absolute; inset: -16px 0 auto 0; height: 16px; }
.marks svg { position: absolute; top: -2px; width: 26px; height: 26px; transform: translateX(-50%); }
.marks path { fill: #d8d6ee; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.marks .lit path { fill: var(--gold); }

.hint {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px;
  color: #fff; font-size: 18px; font-weight: 700; text-shadow: var(--o-sm); white-space: nowrap;
  pointer-events: none; transition: opacity .4s;
}
.hint svg { width: 34px; height: 34px; animation: swipe 1.6s ease-in-out infinite; filter: drop-shadow(0 2px 0 var(--ink)); }
@keyframes swipe { 0%, 100% { transform: translateX(-14px); } 50% { transform: translateX(14px); } }
.hint.gone { opacity: 0; }
.toast {
  position: absolute; left: 50%; top: calc(150px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: #fff; border-radius: 16px; padding: 8px 16px; font-weight: 700; color: var(--ink);
  box-shadow: 0 5px 0 rgba(35,32,94,.25); white-space: nowrap; transition: opacity .3s, transform .3s; pointer-events: none;
}
.toast.gone { opacity: 0; transform: translate(-50%, -12px); }

/* buttons */
.btn {
  font-family: var(--font); font-weight: 700; font-size: 26px; letter-spacing: .02em; color: #fff;
  border: 0; border-radius: 22px; padding: 16px 20px; cursor: pointer;
  background: linear-gradient(180deg, #8bffad 0%, var(--go) 45%, var(--go-d) 100%);
  box-shadow: 0 7px 0 #137538, 0 12px 20px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.6);
  text-shadow: var(--o-sm);
  transition: transform .08s, box-shadow .08s;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #137538, inset 0 2px 0 rgba(255,255,255,.6); }
.btn.blue { background: linear-gradient(180deg, #8fb0ff 0%, var(--blue) 45%, var(--blue-d) 100%); box-shadow: 0 7px 0 #1d3596, 0 12px 20px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.6); font-size: 20px; }
.btn.blue:active { box-shadow: 0 2px 0 #1d3596, inset 0 2px 0 rgba(255,255,255,.6); }
.btn.white { background: #fff; color: var(--ink); text-shadow: none; box-shadow: 0 6px 0 #c9cbe8; font-size: 18px; }
.btn.white:active { box-shadow: 0 1px 0 #c9cbe8; }
.btn.danger { color: var(--bad); }
.btn.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

/* menu */
.screen { position: absolute; inset: 0; }
.menu {
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  padding-block: calc(40px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(35,32,94,.35), rgba(35,32,94,0) 30%, rgba(35,32,94,0) 60%, rgba(35,32,94,.45));
}
.title {
  margin: 0; text-align: center; color: #fff; font-weight: 700; line-height: .86;
  font-size: clamp(58px, 18vw, 92px); letter-spacing: .01em;
  text-shadow: 0 8px 0 var(--ink), 5px 0 0 var(--ink), -5px 0 0 var(--ink), 0 5px 0 var(--ink), 0 -5px 0 var(--ink), 4px 4px 0 var(--ink), -4px 4px 0 var(--ink), 4px -4px 0 var(--ink), -4px -4px 0 var(--ink), 0 16px 30px rgba(0,0,0,.25);
  animation: bob 3s ease-in-out infinite;
}
.title span { display: block; color: var(--gold); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-8px) rotate(1.5deg); } }
.menu-sub { margin-top: 14px; color: #fff; font-weight: 700; font-size: 20px; text-shadow: var(--o-sm); text-align: center; }
.menu-bottom { width: min(360px, 100%); display: flex; flex-direction: column; gap: 18px; }
.menu-bottom .btn { width: 100%; font-size: 34px; padding: 18px; }
.menu-row { display: flex; gap: 12px; justify-content: center; }
.round {
  flex: 1; min-width: 0; height: 64px; border: 0; border-radius: 20px; cursor: pointer; padding: 0 12px;
  background: #fff; color: var(--ink); font-family: var(--font); font-weight: 700; font-size: 17px;
  box-shadow: 0 6px 0 #c9cbe8, 0 10px 18px rgba(0,0,0,.15);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.round:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9cbe8; }
.round svg { width: 30px; height: 30px; flex: none; }
.round.sq { flex: none; width: 64px; padding: 0; }
.menu-stats { display: flex; justify-content: center; gap: 18px; color: #fff; font-weight: 700; font-size: 18px; text-shadow: var(--o-sm); }
.menu-stats span { display: inline-flex; align-items: center; gap: 6px; }
.menu-stats svg { width: 22px; height: 22px; }

/* sheets */
.dim { position: absolute; inset: 0; background: rgba(25, 20, 70, .5); display: flex; align-items: flex-end; justify-content: center; }
.dim.center { align-items: center; padding-block: 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.sheet {
  width: min(460px, 100%); max-height: 88%;
  background: linear-gradient(180deg, #6f95ff, var(--blue) 30%, #3d5fe6);
  border-radius: 30px 30px 0 0; padding: 18px 14px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 -10px 30px rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.35);
  animation: rise .3s cubic-bezier(.2,1.2,.4,1);
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; }
.sheet-head h2 { margin: 0; color: #fff; font-size: 30px; font-weight: 700; text-shadow: var(--o-sm); }
.shop-list { display: grid; gap: 10px; overflow-y: auto; padding: 2px 2px 8px; min-height: 0; }
.up {
  display: grid; grid-template-columns: 60px 1fr auto; gap: 3px 12px; align-items: center;
  background: #fff; border-radius: 20px; padding: 10px; box-shadow: 0 5px 0 rgba(20,30,120,.25);
}
.up .ic { grid-row: 1 / span 3; width: 60px; height: 60px; border-radius: 16px; background: var(--card-2); display: grid; place-items: center; }
.up .ic svg { width: 42px; height: 42px; }
.up h3 { margin: 0; font-size: 17px; font-weight: 700; display: flex; gap: 6px; align-items: baseline; min-width: 0; flex-wrap: wrap; }
.up h3 small { font-size: 12px; color: #fff; background: var(--blue); border-radius: 99px; padding: 1px 8px; font-weight: 700; }
.up .eff { font-size: 13px; color: var(--ink-soft); font-weight: 600; min-width: 0; line-height: 1.3; }
.up .eff b { color: var(--go-d); }
.lvbar { height: 9px; border-radius: 99px; background: #dfe3f7; overflow: hidden; }
.lvbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), #8fb0ff); border-radius: inherit; }
.buy {
  grid-column: 3; grid-row: 1 / span 3;
  font-family: var(--font); font-weight: 700; font-size: 16px; color: #fff; text-shadow: var(--o-sm);
  border: 0; border-radius: 16px; padding: 10px 10px; min-width: 86px; cursor: pointer;
  background: linear-gradient(180deg, #8bffad, var(--go) 45%, var(--go-d));
  box-shadow: 0 5px 0 #137538, inset 0 2px 0 rgba(255,255,255,.6);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.buy:active { transform: translateY(4px); box-shadow: 0 1px 0 #137538; }
.buy[disabled] { background: #cfd3ea; box-shadow: 0 5px 0 #aab0d3; cursor: not-allowed; text-shadow: none; color: #fff; }
.up.bought { animation: flashup .55s; }
@keyframes flashup { 0% { transform: scale(1.04); box-shadow: 0 0 0 4px var(--gold), 0 5px 0 rgba(20,30,120,.25); } 100% { transform: none; } }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: 0 5px 0 rgba(20,30,120,.25); }
.toggle { width: 60px; height: 34px; border-radius: 999px; border: 0; background: #cfd3ea; position: relative; cursor: pointer; padding: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--go); }
.toggle[aria-checked="true"]::after { transform: translateX(26px); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }

/* result */
.result { width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; align-items: stretch; text-align: center; }
.res-level { color: #fff; font-weight: 700; font-size: 40px; text-shadow: var(--o); }
.res-title { color: #fff; font-weight: 700; font-size: 26px; text-shadow: var(--o-sm); margin-top: -8px; }
.stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
.stars svg { width: 76px; height: 76px; }
.stars svg:nth-child(2) { width: 96px; height: 96px; margin-bottom: 14px; }
.stars path { fill: rgba(255,255,255,.35); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.stars .lit path { fill: var(--gold); }
.stars .lit { animation: starpop .45s cubic-bezier(.3,1.7,.5,1) both; }
.stars .lit:nth-child(2) { animation-delay: .18s; } .stars .lit:nth-child(3) { animation-delay: .36s; }
@keyframes starpop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
.res-card { background: #fff; border-radius: 24px; padding: 14px; box-shadow: 0 7px 0 rgba(35,32,94,.3); display: grid; gap: 8px; }
.res-num { font-weight: 700; font-size: 48px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.res-sub { color: var(--ink-soft); font-size: 14px; }
.breakdown { display: grid; gap: 5px; background: var(--card-2); border-radius: 16px; padding: 10px 12px; font-size: 15px; text-align: left; }
.breakdown div { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-soft); }
.breakdown b { color: var(--ink); font-variant-numeric: tabular-nums; }
.breakdown .total { border-top: 2px dashed #cfd3ea; padding-top: 6px; color: var(--ink); font-size: 18px; font-weight: 700; }
.breakdown .total b { color: var(--gold-d); display: inline-flex; align-items: center; gap: 6px; }

@media (prefers-reduced-motion: reduce) {
  .title, .btn.pulse, .hint svg, .sheet, .stars .lit, .up.bought { animation: none; }
  .pop, .praise { animation-duration: .01s; }
}
</style>

<div id="app">
  <canvas id="cv" aria-label="Oyun alanı"></canvas>
  <div class="layer" id="labels"></div>
  <div class="layer" id="pops"></div>

  <header class="hud" id="hud">
    <span class="lvl" id="hudLevel">Seviye 1</span>
    <span class="dots" id="hudDots" aria-label="Aşamalar"></span>
    <div class="r">
      <span class="coins"><i class="coin"></i><span id="hudCoins">0</span></span>
      <button class="icon-btn" id="btnPause" aria-label="Duraklat"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg></button>
    </div>
  </header>

  <div class="goal" id="goal">
    <div class="goal-num"><span id="goalNum">0</span><small id="goalOf"></small></div>
    <div class="goal-sub" id="goalSub">AŞAMA 1/3</div>
    <div class="bar-wrap" id="goalBarWrap"><div class="marks" id="goalMarks"></div><div class="bar"><span id="goalFill"></span></div></div>
  </div>

  <div class="hint" id="hint" hidden>
    <svg viewBox="0 0 40 40"><path d="M16 6a3 3 0 0 1 6 0v12l7 1.5a4 4 0 0 1 3 4.6L30.5 33a4 4 0 0 1-4 3H18a4 4 0 0 1-3.2-1.6L8.4 26a2.8 2.8 0 0 1 4.3-3.6L16 25z" fill="#fff" stroke="#23205e" stroke-width="2.5" stroke-linejoin="round"/></svg>
    Basılı tut ve kaydır
  </div>
  <div class="toast gone" id="toast"></div>

  <!-- Menu -->
  <section class="screen menu" id="scrMenu">
    <div>
      <h1 class="title">TOP<span>YAĞMURU</span></h1>
      <div class="menu-sub" id="menuSub">Seviye 1</div>
    </div>
    <div class="menu-bottom">
      <div class="menu-stats">
        <span><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="#ffc928" stroke="#23205e" stroke-width="2" stroke-linejoin="round"/></svg><span id="menuStars">0</span></span>
        <span><i class="coin sm"></i><span id="menuCoins">0</span></span>
      </div>
      <button class="btn pulse" id="btnPlay">OYNA</button>

<script>
(() => {
'use strict';
const T = window.THREE;
{
  const tc = document.createElement('canvas');
  if (!T || !(tc.getContext('webgl2') || tc.getContext('webgl'))) {
    document.getElementById('app').innerHTML = '<p style="color:#fff;font:700 20px/1.4 Fredoka,sans-serif;text-align:center;padding:40px 20px;text-shadow:0 2px 0 #23205e">Bu oyun 3D grafik (WebGL) kullanıyor. Tarayıcın bunu açamadı. Güncel Chrome, Safari ya da Firefox ile tekrar dene.</p>';

T.ColorManagement.legacyMode = false;   // treat hex colours as sRGB so they stay saturated
const FD = '"Fredoka", "Trebuchet MS", system-ui, sans-serif';

/* ---------- world constants (2D physics on the table plane: x across, y down the table) ---------- */
const W = 400, SH = 720;

/* ---------- utils ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + 'M' : n >= 10000 ? (n / 1000).toFixed(n >= 1e5 ? 0 : 1).replace('.', ',') + 'B' : String(Math.round(n));
const $ = id => document.getElementById(id);

/* ---------- themes: change every 5 levels ---------- */
const THEMES = [
  { name: 'Şeker',   bg: '#ff86c1', shape: 'bean', cols: ['#ff4fa3', '#ffd23f', '#38cfff', '#6cf07a', '#ffffff', '#a77bff'] },
  { name: 'Gökyüzü', bg: '#58c7ff', shape: 'ball', cols: ['#ffffff', '#ffffff', '#fff4c9'] },
  { name: 'Mücevher', bg: '#ffd84d', shape: 'gem', cols: ['#ff3f8e', '#2fd0ff', '#33dd77', '#ffa51f', '#8a5cff'] },
  { name: 'Yıldız',  bg: '#8f7bff', shape: 'star', cols: ['#ffe14d', '#ff6bd6', '#5ef7ff', '#7dff9a'] },
  { name: 'Küp',     bg: '#4fe3b4', shape: 'cube', cols: ['#ff5d6c', '#ffd23f', '#5b8cff', '#ffffff', '#ff9d3c'] },
];
const themeFor = n => THEMES[Math.floor((n - 1) / 5) % THEMES.length];

/* ---------- materials for cups: one tier every 5 upgrade levels ---------- */
const MATS = [
  { name: 'Plastik', color: '#3d7bff', metal: 0,   rough: .3 },
  { name: 'Ahşap',   color: '#c08550', metal: 0,   rough: .65, wood: 1 },
  { name: 'Bakır',   color: '#e08a62', metal: 1,   rough: .28 },
  { name: 'Bronz',   color: '#d6a35c', metal: 1,   rough: .32 },
  { name: 'Gümüş',   color: '#eef2f6', metal: 1,   rough: .16 },
  { name: 'Altın',   color: '#ffc63a', metal: 1,   rough: .14 },
  { name: 'Yeşim',   color: '#2fd391', metal: .1,  rough: .1, glow: .12 },
  { name: 'Yakut',   color: '#ea1f52', metal: .2,  rough: .08, glow: .18 },
  { name: 'Safir',   color: '#2f6bff', metal: .2,  rough: .08, glow: .18 },
  { name: 'Elmas',   color: '#d9f6ff', metal: 0,   rough: 0, glow: .25, opacity: .8 },
  { name: 'Kozmik',  color: '#8a3cff', metal: .5,  rough: .12, glow: .6 },
];
const tierOf = l => Math.min(MATS.length - 1, Math.floor(l / 5));
const matFor = l => MATS[tierOf(l)];

/* ---------- save ---------- */
const SAVE_KEY = 'top-yagmuru.v1';
const UP_IDS = ['start', 'width', 'magnet', 'slow', 'bonus', 'gold', 'income'];
const DEFAULT_SAVE = () => ({ level: 1, coins: 0, stars: {}, up: Object.fromEntries(UP_IDS.map(k => [k, 0])), sound: true, haptic: false });
let save = DEFAULT_SAVE();
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && typeof s === 'object') { const up = Object.assign(save.up, s.up || {}); save = Object.assign(save, s); save.up = up; }
} catch (e) { /* storage unavailable */ }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }
const up = id => save.up[id] || 0;

/* ---------- upgrades: 50 levels each, every level adds the same step ---------- */
const MAXL = 50;
const FX = {
  start:  l => 20 + 5 * l,
  width:  l => Math.round(2.2 * l),
  magnet: l => l ? 50 + 3 * l : 0,
  slow:   l => Math.round(1.1 * l * 10) / 10,
  bonus:  l => Math.round(0.7 * l * 10) / 10,
  gold:   l => Math.round((0.5 + 0.2 * l) * 10) / 10,
  income: l => 6 * l,
};
const fx = id => FX[id](up(id));
const pct = v => '%' + String(v).replace('.', ',');
const UPGRADES = [
  { id: 'start',  name: 'Başlangıç topu', base: 30, show: v => `${v} top`, extra: l => `Bardak: ${matFor(l).name}` },
  { id: 'width',  name: 'Geniş kova',     base: 40, show: v => `${96 + v} genişlik`, extra: l => `Kova: ${matFor(l).name}` },
  { id: 'magnet', name: 'Mıknatıs',       base: 55, show: v => v ? `${v} menzil` : 'kapalı' },
  { id: 'slow',   name: 'Yavaş kova',     base: 45, show: v => `${pct(v)} yavaş` },
  { id: 'bonus',  name: 'Kapı ustası',    base: 60, show: v => `${pct(v)} ekstra top` },
  { id: 'gold',   name: 'Altın şansı',    base: 50, show: v => `${pct(v)} altın top` },
  { id: 'income', name: 'Kazanç',         base: 70, show: v => `+${pct(v)} altın` },
];
const upCost = (u, l) => Math.round(u.base * Math.pow(l + 1, 1.45) / 5) * 5;
const ICONS = {
  start: '<svg viewBox="0 0 40 40"><path d="M9 13h22l-3 22H12z" fill="#4a7bff" stroke="#23205e" stroke-width="2.5" stroke-linejoin="round"/><circle cx="15" cy="10" r="5" fill="#ff4fa3" stroke="#23205e" stroke-width="2"/><circle cx="25" cy="9" r="5" fill="#ffd23f" stroke="#23205e" stroke-width="2"/><circle cx="20" cy="4.5" r="4" fill="#6cf07a" stroke="#23205e" stroke-width="2"/></svg>',
  width: '<svg viewBox="0 0 40 40"><path d="M6 15h28l-4 18H10z" fill="#ffc928" stroke="#23205e" stroke-width="2.5" stroke-linejoin="round"/><path d="M2 8h9M2 8l3-3M2 8l3 3M38 8h-9M38 8l-3-3M38 8l-3 3" stroke="#23205e" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>',
  magnet: '<svg viewBox="0 0 40 40"><path d="M8 6h8v14a4 4 0 0 0 8 0V6h8v14a12 12 0 0 1-24 0z" fill="#ff4d5e" stroke="#23205e" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 6h8v6H8zM24 6h8v6h-8z" fill="#eef2ff" stroke="#23205e" stroke-width="2.5" stroke-linejoin="round"/></svg>',
  slow: '<svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="14" fill="#6cf07a" stroke="#23205e" stroke-width="2.5"/><path d="M20 13v9l6 4" stroke="#23205e" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M15 4h10" stroke="#23205e" stroke-width="3" stroke-linecap="round"/></svg>',
  bonus: '<svg viewBox="0 0 40 40"><rect x="3" y="15" width="34" height="14" rx="5" fill="#3ee07a" stroke="#23205e" stroke-width="2.5"/><path d="M20 2l2.6 5.4 5.9.7-4.4 4 1.2 5.8L20 15l-5.3 2.9 1.2-5.8-4.4-4 5.9-.7z" fill="#ffc928" stroke="#23205e" stroke-width="2" stroke-linejoin="round"/><text x="20" y="26.5" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="10" fill="#fff">+1</text></svg>',
  gold: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#ffc928" stroke="#23205e" stroke-width="2.5"/><circle cx="20" cy="20" r="9" fill="none" stroke="#e09400" stroke-width="2.5"/><circle cx="14" cy="13" r="3" fill="#fff6b0"/></svg>',
  income: '<svg viewBox="0 0 40 40"><path d="M14 8h12l-3 5c7 3 11 9 11 15 0 5-5 8-14 8S6 33 6 28c0-6 4-12 11-15z" fill="#d39a62" stroke="#23205e" stroke-width="2.5" stroke-linejoin="round"/><path d="M16 13h8" stroke="#23205e" stroke-width="2.5"/><circle cx="20" cy="25" r="5" fill="#ffc928" stroke="#23205e" stroke-width="2"/></svg>',
};
const startBalls = () => fx('start');

/* ---------- level generation ---------- */
const TARGETS = [462,945,27,235,745,521,1421,1935,15574,475,2429,2544,866,6488,5864,2969,9810,6849,3288,2199,903,874,10122,7061,896,217,4016,19191,51062,3910,9346,11309,1814,5786,10434,1844,6632,454,5251,1798,13418,813,422,3510,582,2306,688,10668,27055,1852,249,55,3142,3106,56,7871,20064,3631,3000,21218];
function genLevel(n) {
  const rnd = mulberry32(n * 7919 + 101);
  const R = (a, b) => a + rnd() * (b - a);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const diff = Math.min(1, (n - 1) / 18);
  const nStages = 3 + Math.min(2, Math.floor((n - 1) / 5));
  let gid = 0, factor = 1;

  const goodGate = () => {
    const r = rnd();
    if (n >= 7 && r < 0.07) return { op: 'x', k: 5 };
    if (n >= 4 && r < 0.2) return { op: 'x', k: 4 };
    if (r < 0.5) return { op: 'x', k: 3 };
    if (r < 0.85) return { op: 'x', k: 2 };
    return { op: '+', k: pick([5, 10, 15]) };
  };
  const badGate = () => rnd() < 0.5 ? { op: '/', k: 2 } : { op: '-', k: pick([10, 15, 25]) };
  const gateF = g => g.op === 'x' ? g.k : g.op === '+' ? 1.5 : 1;
  const mkGate = (x, y, w, sp, extra) => Object.assign(
    { id: gid++, x, y, w, h: 18, op: sp.op, k: sp.k, uses: Infinity, left: sp.op === '-' ? sp.k : 0, flash: 0, dead: false, mv: null, flip: false },
    extra || {});
  const isMult = t => t === 'gates' || t === 'moving' || t === 'funnel' || t === 'portal';

  const stages = [];
  for (let s = 0; s < nStages; s++) {
    const y0 = s * SH, final = s === nStages - 1;
    const st = { y0, final, gates: [], circles: [], spinners: [], segs: [], portals: [], cup: null };
    st.segs.push({ ax: 0, ay: y0, bx: 0, by: y0 + SH, t: 2 }, { ax: W, ay: y0, bx: W, by: y0 + SH, t: 2 });

    const nRows = rnd() < 0.25 + diff * 0.5 ? 4 : 3;
    const ys = nRows === 4 ? [172, 282, 392, 486] : [182, 312, 442];
    const types = [];
    for (let i = 0; i < nRows; i++) {
      if (s === 0 && i === 0) { types.push('gates'); continue; }
      const opts = [['gates', 4], ['pegs', 2]];
      if (n >= 2) opts.push(['moving', 2], ['bumpers', 1]);
      if (n >= 3) opts.push(['spinners', 1.6]);
      if (n >= 4 && !(nRows === 4 && i === 3)) opts.push(['funnel', 1.2]);
      if (n >= 6 && !(nRows === 4 && i === 3)) opts.push(['portal', 0.8]);
      let tot = opts.reduce((a, o) => a + o[1], 0), r = rnd() * tot, t = opts[0][0];
      for (const o of opts) { if ((r -= o[1]) <= 0) { t = o[0]; break; } }
      types.push(t);
    }
    while (types.filter(isMult).length < 2) types[types.findIndex(t => !isMult(t))] = 'gates';

    types.forEach((t, i) => {
      const y = y0 + ys[i];
      if (t === 'gates') {
        const cnt = rnd() < 0.55 ? 2 : 3, gap = 18, w = (W - 20 - gap * (cnt - 1)) / cnt;
        const specs = [];
        let hasBad = false;
        for (let j = 0; j < cnt; j++) {
          if (!hasBad && j > 0 && n >= 2 && rnd() < 0.18 + 0.3 * diff) { specs.push(badGate()); hasBad = true; }
          else specs.push(goodGate());
        }
        for (let j = specs.length - 1; j > 0; j--) { const r = Math.floor(rnd() * (j + 1)); [specs[j], specs[r]] = [specs[r], specs[j]]; }
        let best = 1;
        specs.forEach((sp, j) => {
          const g = mkGate(10 + j * (w + gap), y, w, sp);
          if (n >= 5 && sp.op === 'x' && sp.k >= 3 && rnd() < 0.3) g.uses = g.maxUses = pick([30, 45, 60]);
          st.gates.push(g);
          best = Math.max(best, gateF(sp));
        });
        for (let j = 1; j < cnt; j++) { const gx = 10 + j * (w + gap) - gap / 2; st.segs.push({ ax: gx, ay: y - 62, bx: gx, by: y + 22, t: 3, deco: 1 }); }
        factor *= 1 + 0.5 * (best - 1);
      } else if (t === 'moving') {
        const sp = { op: 'x', k: pick(n >= 5 ? [3, 4, 4, 5] : [2, 3, 3]) };
        const w = R(84, 110);
        st.gates.push(mkGate(0, y, w, sp, { mv: { c: W / 2, amp: (W - w) / 2 - 12, spd: R(0.7, 1.1) + diff * 0.8, ph: R(0, 6.28) } }));
        st.circles.push({ x: 40, y: y - 34, r: 5, kind: 'peg', flash: 0 }, { x: W - 40, y: y - 34, r: 5, kind: 'peg', flash: 0 });
        factor *= 1 + 0.28 * (sp.k - 1);
      } else if (t === 'pegs') {
        for (let r = 0; r < 2; r++) { const off = r ? 22 : 0; for (let x = 24 + off; x < W - 14; x += 44) st.circles.push({ x, y: y - 18 + r * 36, r: 5, kind: 'peg', flash: 0 }); }
      } else if (t === 'spinners') {
        const cnt = rnd() < 0.5 ? 1 : 2;
        for (let j = 0; j < cnt; j++) st.spinners.push({ x: W / (cnt + 1) * (j + 1), y, L: cnt === 1 ? 80 : 58, a: R(0, 3.14), w: (rnd() < 0.5 ? -1 : 1) * R(1.4, 2.4 + diff) });
      } else if (t === 'bumpers') {
        [70, 200, 330].forEach((x, j) => st.circles.push({ x: x + R(-14, 14), y: y + (j === 1 ? -14 : 12), r: 15, kind: 'bumper', flash: 0 }));
      } else if (t === 'funnel') {
        const gx = R(130, 270), half = 36;
        st.segs.push({ ax: 2, ay: y - 46, bx: gx - half, by: y + 8, t: 3, deco: 1 }, { ax: W - 2, ay: y - 46, bx: gx + half, by: y + 8, t: 3, deco: 1 });
        const sp = { op: 'x', k: pick(n >= 8 ? [2, 3] : [2, 2, 3]) };
        st.gates.push(mkGate(gx - 40, y + 40, 80, sp));
        factor *= 1 + 0.8 * (sp.k - 1);
      } else if (t === 'portal') {
        const left = rnd() < 0.5;
        const ix = left ? R(50, 110) : R(290, 350), ex = left ? R(250, 330) : R(70, 150);
        st.portals.push({ ix, iy: y - 22, ex, ey: y + 4, r: 17 });
        const sp = { op: 'x', k: pick([3, 4]) };
        st.gates.push(mkGate(ex - 42, y + 50, 84, sp));
        factor *= 1 + 0.35 * (sp.k - 1);
      }
    });

    const baseW = final ? (n < 5 ? 150 : 124) : 96;
    st.cup = { w: baseW, moving: !final || n >= 5, spd: final ? 0.45 + diff * 0.4 : R(0.5, 0.8) + diff * 0.6, ph: R(0, 6.28) };
    factor *= final ? 0.75 : 0.62;
    stages.push(st);
  }
  // levels 1-60 use targets measured by playing each level with a bot; later levels fall back to the estimate
  const target = n <= TARGETS.length ? TARGETS[n - 1] : Math.max(12, Math.round(20 * factor * 0.19 * (0.62 + 0.3 * diff)));
  // more starting balls raise the target a little, so that upgrade still pays off without trivialising levels
  return { n, stages, target: Math.round(target * Math.sqrt(startBalls() / 20)) };
}

/* ---------- audio ---------- */
let AC = null, sndBudget = 30;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function tone(freq, dur = 0.06, type = 'triangle', vol = 0.05, slide = 0) {
  if (!save.sound || sndBudget < 1 || G.demo) return;
  const a = ac(); if (!a) return;
  sndBudget--;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
let hapticT = 0;
function buzz(ms) {
  if (!save.haptic || G.demo || G.t - hapticT < 0.25) return;
  hapticT = G.t;
  try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* not allowed */ }
}

/* ---------- game state ---------- */
const G = {
  state: 'menu', demo: false, paused: false, L: null, st: null, si: 0, theme: THEMES[0],
  balls: [], parts: [],
  t: 0, acc: 0, pour: null, cup: null, cam: 0, shake: 0,
  trans: null, input: { x: W / 2, hold: false, keyL: false, keyR: false },
  endT: 0, emptyT: 0, gold: 0, poured: false,
};

function cupX(c, t) { return W / 2 + c.amp * Math.sin(t * c.spd + c.ph); }
function makeCup(st) {
  const w = st.cup.w + fx('width');
  const c = { w, y: st.y0 + RIM, count: 0, bump: 0, final: st.final, amp: st.cup.moving ? Math.max(0, (W - w) / 2 - 8) : 0, spd: st.cup.spd * (1 - fx('slow') / 100), ph: st.cup.ph, x: W / 2, vx: 0 };
  c.x = cupX(c, G.t);
  return c;
}

function startLevel(n, demo) {
  G.demo = !!demo;
  G.L = genLevel(n);
  G.gold = 0; G.parts.length = 0;
  G.state = 'play'; G.paused = false; G.poured = false;
  setTheme(themeFor(n));
  build3DLevel();
  startStage(0, startBalls(), W / 2);
  buildDots(); buildMarks();
  clearTimeout(resultTimer);
  if (!demo) { show(null); $('hint').hidden = false; $('hint').classList.remove('gone'); }
}

function startStage(si, supply, x) {
  G.si = si;
  const st = G.st = G.L.stages[si];
  G.balls.length = 0;
  const chunks = Math.min(supply, 420);
  G.pour = {
    x, y: st.y0 + POUR_Y, supply, emitted: 0, emittedV: 0, chunks,
    per: Math.floor(supply / chunks), rem: supply % chunks, tilt: 0, acc: 0,
    rate: Math.min(170, Math.max(26, chunks / 2.6)),
  };
  G.cup = makeCup(st);
  G.input.x = x;
  G.endT = 0; G.emptyT = 0; G.acc = 0;
  G.cam = st.y0;
  G.state = 'play';
  rebuildTray();
  updateHud(true);
}

function newBall(x, y, vx, vy, v) {
  return { x, y, vx, vy, v, r: v <= 1 ? 5 : Math.min(9, 5 + Math.log2(v) * 0.8), g: [], pc: 0, gold: false, dead: false, c: (Math.random() * 6) | 0, hz: 0, vh: 0, q: null };
}
function setV(b, v) { b.v = v; b.r = v <= 1 ? 5 : Math.min(9, 5 + Math.log2(v) * 0.8); }

function mouth(p, tilt) {
  const a = tilt * 2.25;
  return { x: p.x + 22 * Math.sin(a), y: p.y - 22 * Math.cos(a), nx: Math.sin(a), ny: -Math.cos(a) };
}

function emit() {
  const p = G.pour;
  const v = p.per + (p.emitted < p.rem ? 1 : 0);
  p.emitted++; p.emittedV += v;
  const m = mouth(p, p.tilt);
  const b = newBall(m.x + rand(-2, 2), m.y + rand(-2, 2), m.nx * 90 + rand(-20, 20), m.ny * 90 + rand(0, 30), v);
  b.hz = 40; b.vh = 40;
  G.balls.push(b);
  if (p.emitted % 3 === 0) tone(880 + rand(-60, 60), 0.025, 'sine', 0.018);
}

/* ---------- gates ---------- */
function spawnFrom(b, v, spread) {
  const nb = newBall(b.x + rand(-5, 5), b.y + rand(-3, 3), b.vx + rand(-spread, spread), b.vy * rand(0.85, 1.05), v);
  nb.g = b.g.slice();
  nb.hz = 2; nb.vh = rand(40, 110);
  if (Math.random() < fx('gold') / 100) nb.gold = true;
  G.balls.push(nb);
}
function popAt(g, text) {
  if (g.popT > G.t) return;
  g.popT = G.t + 0.5;
  popText(g.x + g.w / 2 + rand(-12, 12), g.y - 10, text, '');
}
function sparks(x, y, col, n, power = 1) {
  if (G.parts.length > 520) return;
  for (let i = 0; i < n; i++) G.parts.push({ x, y, h: 6, vx: rand(-70, 70) * power, vy: rand(-60, 30) * power, vh: rand(90, 220) * power, life: rand(0.5, 0.9), col, s: rand(1.4, 2.6), rot: rand(0, 6), vr: rand(-12, 12) });
}
function applyGate(b, g) {
  g.flash = 1;
  if (g.op === 'x') {
    if (G.balls.length + g.k - 1 <= CAP) for (let i = 0; i < g.k - 1; i++) spawnFrom(b, b.v, 70);
    else setV(b, b.v * g.k);
    popAt(g, '×' + g.k);
    tone(420 + g.k * 120 + rand(-30, 30), 0.05, 'triangle', 0.035);
    buzz(8);
  } else if (g.op === '+') {
    if (G.balls.length + g.k <= CAP) for (let i = 0; i < g.k; i++) spawnFrom(b, 1, 110);
    else setV(b, b.v + g.k);
    popAt(g, '+' + g.k);
    tone(700, 0.05, 'triangle', 0.035);
  } else if (g.op === '/') {
    if (b.v > 1) setV(b, Math.ceil(b.v / 2));
    else { g.flip = !g.flip; if (g.flip) kill(b, BAD); }
    tone(180, 0.07, 'square', 0.02, 0.7);
  } else if (g.op === '-') {
    const take = Math.min(b.v, g.left);
    g.left -= take; setV(b, b.v - take); g.dirty = true;
    if (b.v <= 0) kill(b, BAD);
    if (g.left <= 0) breakGate(g);
    tone(160, 0.07, 'square', 0.02, 0.7);
  }
  const good = g.op === 'x' || g.op === '+';
  if (good && !b.dead && Math.random() < fx('bonus') / 100 && G.balls.length < CAP) {
    spawnFrom(b, b.v, 90);
    popText(b.x, g.y, '+1', 'gold');
    sparks(b.x, g.y, GOLD, 3);
  }
  if (g.uses !== Infinity && !g.dead) { g.uses--; g.dirty = true; if (g.uses <= 0) breakGate(g); }
}
function breakGate(g) {
  if (g.dead) return;
  g.dead = true;
  const col = g.op === 'x' || g.op === '+' ? GOOD : BAD;
  for (let i = 0; i < 30; i++) G.parts.push({ x: g.x + Math.random() * g.w, y: g.y + rand(-8, 8), h: 4, vx: rand(-110, 110), vy: rand(-90, 60), vh: rand(150, 320), life: rand(.8, 1.2), col, s: rand(2.5, 4.5), rot: rand(0, 6), vr: rand(-10, 10) });
  G.shake = Math.max(G.shake, 6);
  tone(300, 0.18, 'sawtooth', 0.03, 0.4);
}
function kill(b, col) {
  b.dead = true;
  if (G.parts.length < 520) for (let i = 0; i < 2; i++) G.parts.push({ x: b.x, y: b.y, h: b.hz + 4, vx: rand(-50, 50), vy: rand(-40, 40), vh: rand(40, 120), life: 0.45, col, s: rand(1, 2), rot: 0, vr: rand(-8, 8) });
}

/* ---------- physics ---------- */
function collideSeg(b, ax, ay, bx, by, th, ux, uy, e, sp) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = ((b.x - ax) * dx + (b.y - ay) * dy) / l2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const px = ax + dx * t, py = ay + dy * t;
  let nx = b.x - px, ny = b.y - py;
  const d2 = nx * nx + ny * ny, R = b.r + th;
  if (d2 >= R * R) return false;
  const d = Math.sqrt(d2) || 0.0001;
  nx /= d; ny /= d;
  if (d2 === 0) { nx = -dy / Math.sqrt(l2); ny = dx / Math.sqrt(l2); }
  b.x = px + nx * R; b.y = py + ny * R;
  if (sp) { ux = -sp.w * (py - sp.y); uy = sp.w * (px - sp.x); }
  let rvx = b.vx - ux, rvy = b.vy - uy;
  const vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    rvx -= (1 + e) * vn * nx; rvy -= (1 + e) * vn * ny;
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty;
    rvx -= vt * tx * 0.04; rvy -= vt * ty * 0.04;
    b.vx = rvx + ux; b.vy = rvy + uy;
  }
  return true;
}
function collideCircle(b, o) {
  const dx = b.x - o.x, dy = b.y - o.y, d2 = dx * dx + dy * dy, R = b.r + o.r;
  if (d2 >= R * R) return;
  const d = Math.sqrt(d2) || 0.0001, nx = dx / d, ny = dy / d;
  b.x = o.x + nx * R; b.y = o.y + ny * R;
  const vn = b.vx * nx + b.vy * ny;
  if (o.kind === 'bumper') {
    if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
    b.vx += nx * 160; b.vy += ny * 160;
    if (o.flash < 0.5) tone(520 + rand(-40, 40), 0.06, 'sine', 0.03, 1.4);
    o.flash = 1;
  } else if (vn < 0) {
    b.vx -= 1.45 * vn * nx; b.vy -= 1.45 * vn * ny;
    b.vx += rand(-6, 6);
    o.flash = Math.max(o.flash, 0.6);
  }
}

let gHead = new Int32Array(0), gNext = new Int32Array(0);
const CELL = 16, GCOLS = Math.ceil(W / CELL) + 2, GROWS = Math.ceil(SH / CELL) + 4;
function ballBall() {
  const B = G.balls, n = B.length;
  if (n < 2) return;
  if (gHead.length !== GCOLS * GROWS) gHead = new Int32Array(GCOLS * GROWS);
  if (gNext.length < n) gNext = new Int32Array(n * 2);
  gHead.fill(-1);
  const y0 = G.st.y0 - CELL * 2;
  for (let i = 0; i < n; i++) {
    const b = B[i]; if (b.dead) continue;
    const cx = clamp((b.x / CELL | 0) + 1, 0, GCOLS - 1), cy = clamp(((b.y - y0) / CELL | 0), 0, GROWS - 1);
    const k = cy * GCOLS + cx;
    gNext[i] = gHead[k]; gHead[k] = i;
  }
  for (let i = 0; i < n; i++) {
    const a = B[i]; if (a.dead) continue;
    const cx = clamp((a.x / CELL | 0) + 1, 0, GCOLS - 1), cy = clamp(((a.y - y0) / CELL | 0), 0, GROWS - 1);
    for (let oy = -1; oy <= 1; oy++) {
      const yy = cy + oy; if (yy < 0 || yy >= GROWS) continue;
      for (let ox = -1; ox <= 1; ox++) {
        const xx = cx + ox; if (xx < 0 || xx >= GCOLS) continue;
        for (let j = gHead[yy * GCOLS + xx]; j !== -1; j = gNext[j]) {
          if (j <= i) continue;
          const b = B[j]; if (b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, R = a.r + b.r;
          if (d2 >= R * R || d2 === 0) continue;
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (R - d) * 0.5;
          a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
          const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (vn < 0) { const imp = -0.6 * vn; a.vx -= imp * nx; a.vy -= imp * ny; b.vx += imp * nx; b.vy += imp * ny; }
        }
      }
    }
  }
}

function cupSegs(c) {
  const l = c.x - c.w / 2, r = c.x + c.w / 2, y = c.y;
  return [[l, y, l + 7, y + CUP_H], [r, y, r - 7, y + CUP_H], [l + 7, y + CUP_H, r - 7, y + CUP_H]];
}

function step(h) {
  const st = G.st, c = G.cup, B = G.balls;
  const cs = cupSegs(c), magR = fx('magnet'), magF = 120 + 9 * up('magnet');
  for (let i = 0; i < B.length; i++) {
    const b = B[i]; if (b.dead) continue;
    b.vy += GRAV * h;
    if (magR && b.y > c.y - 170 && b.y < c.y + 6) { const dx = c.x - b.x; if (Math.abs(dx) < magR) b.vx += Math.sign(dx) * magF * h; }
    b.vx *= 1 - 0.25 * h;
    const s2 = b.vx * b.vx + b.vy * b.vy;
    if (s2 > MAXV * MAXV) { const k = MAXV / Math.sqrt(s2); b.vx *= k; b.vy *= k; }
    b.x += b.vx * h; b.y += b.vy * h;
    if (b.pc > 0) b.pc -= h;

    for (const s of st.segs) {
      if (b.y < Math.min(s.ay, s.by) - 14 || b.y > Math.max(s.ay, s.by) + 14) continue;
      collideSeg(b, s.ax, s.ay, s.bx, s.by, s.t, 0, 0, 0.45);
    }
    if (b.y > c.y - 14) for (const s of cs) collideSeg(b, s[0], s[1], s[2], s[3], 3, c.vx, 0, 0.3);
    for (const o of st.circles) if (Math.abs(o.y - b.y) <= o.r + 10) collideCircle(b, o);
    for (const sp of st.spinners) {
      if (Math.abs(sp.y - b.y) > sp.L + 10) continue;
      const ca = Math.cos(sp.a) * sp.L, sa = Math.sin(sp.a) * sp.L;
      collideSeg(b, sp.x - ca, sp.y - sa, sp.x + ca, sp.y + sa, 4, 0, 0, 0.5, sp);
    }
    for (const g of st.gates) {
      if (g.dead) continue;
      if (b.y > g.y - g.h / 2 && b.y < g.y + g.h / 2 && b.x > g.x && b.x < g.x + g.w && b.g.indexOf(g.id) < 0) {
        b.g.push(g.id); applyGate(b, g);
        if (b.dead) break;
      }
    }
    if (b.dead) continue;
    for (const p of st.portals) {
      if (b.pc > 0) break;
      const dx = b.x - p.ix, dy = b.y - p.iy;
      if (dx * dx + dy * dy < p.r * p.r) {
        b.x = p.ex + rand(-4, 4); b.y = p.ey; b.vx *= 0.3; b.vy = Math.max(60, b.vy * 0.5); b.pc = 0.5; b.hz = 18; b.vh = 60;
        if (!p.flash || p.flash < 0.5) tone(990, 0.08, 'sine', 0.025, 0.6);
        p.flash = 1;
      }
    }

    if (b.y > c.y + 10 && b.y < c.y + CUP_H + 4 && b.x > c.x - c.w / 2 + 5 && b.x < c.x + c.w / 2 - 5) {
      b.dead = true;
      c.count += b.v; c.bump = 1;
      if (b.gold) { G.gold += 1; popText(b.x, c.y, '+1', 'gold'); sparks(b.x, c.y + 20, GOLD, 5); tone(1320, 0.12, 'sine', 0.04, 1.3); }
      else tone(600 + Math.min(600, c.count * 2), 0.03, 'sine', 0.02);
      continue;
    }
    if (b.y > st.y0 + LOST) { kill(b, '#ffffff'); continue; }
    if (b.y < st.y0 + 6) { b.y = st.y0 + 6; if (b.vy < 0) b.vy *= -0.4; }
  }
  ballBall();
}

/* ---------- bot (menu demo) ---------- */
function botInput() {
  const st = G.st;
  const gates = st.gates.filter(g => !g.dead && g.y < st.y0 + 330 && (g.op === 'x' || g.op === '+'));
  let best = null;
  for (const g of gates) if (!best || g.k > best.k) best = g;
  const aim = best ? best.x + best.w / 2 : W / 2;
  G.input.x = aim - 17;
  const future = cupX(G.cup, G.t + 1.15);
  G.input.hold = G.cup.amp === 0 || Math.abs(future - aim) < G.cup.w * 0.6;
}

/* ---------- update ---------- */
function update(dt) {
  G.t += dt;
  sndBudget = Math.min(30, sndBudget + dt * 40);
  G.shake = Math.max(0, G.shake - dt * 22);

  for (const p of G.parts) {
    p.vh -= (p.conf ? 70 : 560) * dt;
    if (p.conf) { p.vh = Math.max(p.vh, -80); p.vx += Math.sin(G.t * 3 + p.rot) * 30 * dt; }
    p.h += p.vh * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.h < 0) { p.h = 0; p.vh *= -0.3; p.vx *= 0.5; p.vy *= 0.5; p.vr *= 0.5; }
    p.life -= dt;
  }
  if (G.parts.some(p => p.life <= 0)) G.parts = G.parts.filter(p => p.life > 0);

  if (G.state === 'transition') {
    const tr = G.trans;
    tr.t += dt / 1.2;
    G.cam = tr.from + (tr.to - tr.from) * ease(clamp(tr.t, 0, 1));
    if (tr.t >= 1) startStage(G.si + 1, tr.count, tr.x);
    return;
  }
  if (G.state !== 'play' || G.paused) return;
  if (G.demo) botInput();

  const st = G.st, p = G.pour, c = G.cup, inp = G.input;
  if (inp.keyL) inp.x -= 300 * dt;
  if (inp.keyR) inp.x += 300 * dt;
  inp.x = clamp(inp.x, 26, W - 26);
  p.x += (inp.x - p.x) * Math.min(1, dt * 14);
  const left = p.emitted < p.chunks;
  const pouring = inp.hold && left;
  p.tilt += ((pouring ? 1 : 0) - p.tilt) * Math.min(1, dt * 10);
  if (pouring && p.tilt > 0.7) {
    p.acc += p.rate * dt;
    while (p.acc >= 1 && p.emitted < p.chunks) { p.acc -= 1; emit(); }
    if (!G.poured && !G.demo) { G.poured = true; $('hint').classList.add('gone'); }
  }

  for (const g of st.gates) {
    if (g.mv) g.x = g.mv.c + g.mv.amp * Math.sin(G.t * g.mv.spd + g.mv.ph) - g.w / 2;
    g.flash = Math.max(0, g.flash - dt * 4);
  }
  for (const o of st.circles) o.flash = Math.max(0, o.flash - dt * 4);
  for (const pt of st.portals) pt.flash = Math.max(0, (pt.flash || 0) - dt * 3);
  for (const sp of st.spinners) sp.a += sp.w * dt;
  const nx = cupX(c, G.t);
  c.vx = (nx - c.x) / Math.max(dt, 1e-4); c.x = nx;
  c.bump = Math.max(0, c.bump - dt * 5);

  G.acc += dt;
  let steps = 0;
  while (G.acc >= H && steps < 8) { step(H); G.acc -= H; steps++; }
  if (steps >= 8) G.acc = 0;
  if (G.balls.some(b => b.dead)) G.balls = G.balls.filter(b => !b.dead);

  if (!left) {
    G.emptyT += dt;
    if (G.balls.length === 0) G.endT += dt;
    if (G.endT > 0.45 || G.emptyT > 14) finishStage();
  }
  updateHud();
}

const PRAISE = ['SÜPER!', 'HARİKA!', 'MÜTHİŞ!', 'BRAVO!', 'EFSANE!'];
function finishStage() {
  const c = G.cup;
  for (const b of G.balls) kill(b, '#ffffff');
  G.balls.length = 0;
  if (c.final) return finishLevel(c.count);
  if (c.count <= 0) return finishLevel(0, 'Kova boş kaldı');
  if (c.count >= G.pour.supply * 2) praise(PRAISE[(Math.random() * PRAISE.length) | 0], c.count >= G.pour.supply * 8);
  G.state = 'transition';
  const next = G.L.stages[G.si + 1];
  G.trans = { t: 0, from: G.st.y0, to: next.y0, count: c.count, x: clamp(c.x, 26, W - 26), cupFrom: c.y, cupTo: next.y0 + POUR_Y };
  sparks(c.x, c.y + 20, '#ffffff', 14, 1.3);
  tone(520, 0.12, 'triangle', 0.04, 1.5);
  updateHud(true);
}

function confetti() {
  const cols = G.theme.cols.concat([GOLD, '#ffffff', '#ff4fa3', '#38cfff']);
  const zc = G.cam + CAM.zc;
  for (let i = 0; i < 160; i++) G.parts.push({ x: rand(-40, W + 40), y: zc + rand(-360, 260), h: rand(220, 420), vx: rand(-30, 30), vy: rand(-20, 20), vh: rand(-60, 0), life: rand(2.4, 3.6), col: cols[i % cols.length], s: rand(3, 5), rot: rand(0, 6), vr: rand(-6, 6), conf: true });
}

function finishLevel(count, reason) {
  G.state = 'result';
  if (G.demo) { clearTimeout(resultTimer); resultTimer = setTimeout(() => { if (G.demo && G.state === 'result') startDemo(); }, 1200); return; }
  const L = G.L, target = L.target;
  const stars = count >= target * 2.5 ? 3 : count >= target * 1.6 ? 2 : count >= target ? 1 : 0;
  const win = stars > 0;
  const starPart = win ? 15 * stars + 5 * Math.min(L.n, 60) : 0;
  const ballPart = win ? Math.floor(Math.sqrt(count) * 2) : Math.floor(Math.sqrt(count));
  const goldPart = G.gold;
  const incomePct = fx('income');
  const sub = starPart + ballPart + goldPart;
  const coins = Math.round(sub * (1 + incomePct / 100));
  save.coins += coins;
  if (win) {
    save.stars[L.n] = Math.max(save.stars[L.n] || 0, stars);
    save.level = Math.max(save.level, L.n + 1);
  }
  persist();

  $('resLevel').textContent = `SEVİYE ${L.n}`;
  $('resTitle').textContent = win ? ['', 'Tamamlandı!', 'Çok iyi!', 'Kusursuz!'][stars] : (reason || 'Az kaldı!');
  $('resNum').textContent = fmt(count);
  $('resSub').textContent = win ? `Hedef ${fmt(target)} · 2★ ${fmt(Math.ceil(target * 1.6))} · 3★ ${fmt(Math.ceil(target * 2.5))}` : `Hedef ${fmt(target)}. ${fmt(Math.max(0, target - count))} top eksik.`;
  const line = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
  $('resBreak').innerHTML =
    (win ? line(`${stars} yıldız`, '+' + starPart) : '') +
    line('Toplanan toplar', '+' + ballPart) +
    (G.gold ? line(`Altın top × ${G.gold}`, '+' + goldPart) : '') +
    (incomePct ? line(`Kazanç bonusu ${pct(incomePct)}`, '+' + (coins - sub)) : '') +
    `<div class="total"><span>Toplam</span><b><i class="coin sm"></i>+${coins}</b></div>`;
  $('resStars').innerHTML = [0, 1, 2].map(i => `<svg viewBox="0 0 24 24" class="${i < stars ? 'lit' : ''}"><path d="${STAR_PATH}"/></svg>`).join('');
  const bNext = $('btnNext');
  bNext.textContent = win ? 'Devam' : 'Tekrar dene';
  bNext.dataset.act = win ? 'next' : 'retry';
  $('btnRetry').hidden = !win;
  if (win) { confetti(); praise(stars === 3 ? 'KUSURSUZ!' : PRAISE[(Math.random() * PRAISE.length) | 0], stars === 3); [0, 1, 2, 3].forEach(i => setTimeout(() => tone(523 * Math.pow(1.26, i), 0.2, 'triangle', 0.05), 110 * i)); buzz(30); }
  else tone(300, 0.3, 'triangle', 0.04, 0.6);
  updateHud(true);
  clearTimeout(resultTimer);
  resultTimer = setTimeout(() => show('scrResult'), win ? 1300 : 500);
}

/* ======================================================================
   3D
   ====================================================================== */
const cv = $('cv');
const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(42, 1, 10, 6000);
const pmrem = new T.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture;
const hemi = new T.HemisphereLight(0xffffff, 0x8a5a3a, 0.3);
scene.add(hemi);

function woodTexture(dark) {
  const c = canvasOf(512, 1024), x = c.getContext('2d'), rnd = mulberry32(dark ? 11 : 5);
  const tones = dark ? ['#6a3d20', '#744423', '#5e351b'] : ['#e3b682', '#dcae79', '#e8bd8a', '#d7a671'];
  for (let i = 0; i < 4; i++) { x.fillStyle = tones[i % tones.length].slice(0, 7); x.fillRect(i * 128, 0, 128, 1024); }
  for (let i = 0; i < 700; i++) {

    x.strokeStyle = dark ? `rgba(30,12,4,${0.05 + rnd() * 0.12})` : `rgba(160,100,50,${0.04 + rnd() * 0.1})`;
    x.lineWidth = 0.6 + rnd() * 1.8;
    x.beginPath();
    let yy = rnd() * 1024 - 200;
    x.moveTo(px, yy);
    for (let k = 0; k < 10; k++) { yy += 30 + rnd() * 50; x.lineTo(px + Math.sin(yy * 0.015 + i) * 4, yy); }
    x.stroke();
  }
  for (let i = 0; i < 5; i++) {
    const kx = rnd() * 512, ky = rnd() * 1024, rg = x.createRadialGradient(kx, ky, 1, kx, ky, 16);
    rg.addColorStop(0, dark ? 'rgba(20,8,2,.5)' : 'rgba(140,80,35,.45)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = rg; x.beginPath(); x.ellipse(kx, ky, 8, 18, 0, 0, 7); x.fill();
  }
  x.fillStyle = dark ? 'rgba(0,0,0,.35)' : 'rgba(120,70,30,.35)';
  for (let i = 1; i < 4; i++) x.fillRect(i * 128 - 1, 0, 2, 1024);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = ANIS;
  return t;
}

/* level meshes */
let levelGroup = null;
const levelObjs = { gates: [], circles: [], spinners: [], portals: [] };
function box(w, h, d, mat, r = 0) {
  const g = r ? new T.RoundedBoxGeometry(w, h, d, 2, r) : new T.BoxGeometry(w, h, d);
  const m = new T.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m;
}
function gateLabel(g) {
  const good = g.op === 'x' || g.op === '+';
  const txt = g.op === 'x' ? '×' + g.k : g.op === '+' ? '+' + g.k : g.op === '/' ? '÷' + g.k : '−' + g.left;
  return textTexture(txt, '#ffffff', good ? '#0d6b33' : '#8a0f1d');
}
function build3DLevel() {
  if (levelGroup) {
    scene.remove(levelGroup);
    levelGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material.userData.own) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  }
  levelGroup = new T.Group();
  levelObjs.gates = []; levelObjs.circles = []; levelObjs.spinners = []; levelObjs.portals = [];
  const L = G.L, len = L.stages.length * SH;
  // table
  const tex = WOOD.clone(); tex.needsUpdate = true; tex.repeat.set(1, len / 760);
  const bm = new T.MeshStandardMaterial({ map: tex, roughness: 0.8, envMapIntensity: 0.35 }); bm.userData.own = true;
  const board = new T.Mesh(new T.BoxGeometry(W, 16, len + 300), bm);
  board.position.set(0, -8, len / 2 - 60); board.receiveShadow = true;
  levelGroup.add(board);
  for (const sx of [-1, 1]) {
    const rail = box(18, 40, len + 300, matDark, 3);
    rail.position.set(sx * (W / 2 + 9), 12, len / 2 - 60);
    levelGroup.add(rail);
  }
  L.stages.forEach((st, si) => {
    // drain slot under each stage
    const slot = new T.Mesh(new T.BoxGeometry(W, 1, 18), matSlot);
    slot.position.set(0, 0.2, st.y0 + LOST + 10); slot.receiveShadow = true;
    levelGroup.add(slot);
    // stage tag painted on the table
    const tm = new T.MeshBasicMaterial({ map: textTexture(st.final ? 'FİNAL' : `AŞAMA ${si + 1}`, 'rgba(255,255,255,0.85)', 'rgba(120,70,30,0.35)', 256, 64, 40), transparent: true, depthWrite: false });
    tm.userData.own = true;
    const tag = new T.Mesh(new T.PlaneGeometry(80, 20), tm);
    tag.rotation.x = -Math.PI / 2; tag.position.set(X(60), 0.3, st.y0 + 26);
    levelGroup.add(tag);
    // walls
    for (const s of st.segs) {
      if (!s.deco) continue;
      const dx = s.bx - s.ax, dy = s.by - s.ay, l = Math.hypot(dx, dy);
      const m = box(l + s.t * 2 + 2, 28, s.t * 2 + 5, matDark, 2.8);
      m.position.set(X((s.ax + s.bx) / 2), 14, (s.ay + s.by) / 2);
      m.rotation.y = -Math.atan2(dy, dx);
      levelGroup.add(m);
    }
    // gates
    for (const g of st.gates) {
      const grp = new T.Group();
      const col = new T.Color(g.op === 'x' || g.op === '+' ? GOOD : BAD);
      const mat = new T.MeshStandardMaterial({ color: col, transparent: true, opacity: 0.88, emissive: col, emissiveIntensity: 0.3, roughness: 0.25, envMapIntensity: 0.3, depthWrite: false });
      mat.userData.own = true;
      const slab = new T.Mesh(new T.BoxGeometry(g.w, 4, g.h + 14), mat);
      slab.position.y = 2;
      const edgeMat = new T.MeshStandardMaterial({ color: col.clone().lerp(new T.Color('#ffffff'), 0.45), emissive: col, emissiveIntensity: 0.5, roughness: 0.2 });
      edgeMat.userData.own = true;
      const e1 = new T.Mesh(new T.BoxGeometry(g.w, 3, 2.2), edgeMat); e1.position.set(0, 1.6, -(g.h + 14) / 2);
      const e2 = e1.clone(); e2.position.z = (g.h + 14) / 2;
      const lm = new T.MeshBasicMaterial({ map: gateLabel(g), transparent: true, depthWrite: false });
      lm.userData.own = true;
      const lw = Math.min(g.w - 4, 120);
      const label = new T.Mesh(new T.PlaneGeometry(lw, lw * 96 / 256), lm);
      label.rotation.x = -Math.PI / 2 + 0.7; label.position.set(0, 12, 0);
      grp.add(slab, e1, e2, label);
      grp.position.set(X(g.x + g.w / 2), 0, g.y);
      levelGroup.add(grp);
      levelObjs.gates.push({ g, grp, mat, label, lm });
    }
    for (const o of st.circles) {
      let m;
      if (o.kind === 'bumper') {
        m = new T.Group();
        const body = new T.Mesh(new T.CylinderGeometry(o.r, o.r + 1, 14, 32), matPink); body.position.y = 7; body.castShadow = true;
        const ring = new T.Mesh(new T.TorusGeometry(o.r - 3, 2.2, 10, 32), matPeg); ring.rotation.x = Math.PI / 2; ring.position.y = 14.5;
        const cap = new T.Mesh(new T.CylinderGeometry(o.r * 0.45, o.r * 0.45, 3, 24), new T.MeshStandardMaterial({ color: 0xffc928, roughness: .2, metalness: .3 }));
        cap.material.userData.own = true; cap.position.y = 15;
        m.add(body, ring, cap);
      } else {
        m = new T.Mesh(new T.CylinderGeometry(o.r, o.r, 16, 20), matPeg); m.position.y = 8; m.castShadow = true;
        const top = new T.Mesh(new T.SphereGeometry(o.r, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), matPeg); top.position.y = 8; m.add(top);
      }
      m.position.x = X(o.x); m.position.z = o.y;
      levelGroup.add(m);
      levelObjs.circles.push({ o, m, baseY: m.position.y });
    }
    for (const sp of st.spinners) {
      const m = new T.Group();
      const bar = box(sp.L * 2 + 8, 14, 9, matPink, 3); bar.position.y = 9;
      const hub = new T.Mesh(new T.CylinderGeometry(6, 6, 18, 20), matPeg); hub.position.y = 9; hub.castShadow = true;
      m.add(bar, hub); m.position.set(X(sp.x), 0, sp.y);
      levelGroup.add(m);
      levelObjs.spinners.push({ sp, m });
    }
    for (const p of st.portals) {
      const mk = (x, y, r, col) => {
        const g = new T.Group();
        const mat = new T.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.8, roughness: .2 }); mat.userData.own = true;
        const ring = new T.Mesh(new T.TorusGeometry(r, 3, 12, 40), mat); ring.rotation.x = Math.PI / 2; ring.position.y = 3;
        const dm = new T.MeshBasicMaterial({ color: 0x1a0640 }); dm.userData.own = true;
        const disc = new T.Mesh(new T.CircleGeometry(r, 32), dm); disc.rotation.x = -Math.PI / 2; disc.position.y = 0.6;
        const sw = new T.Mesh(new T.TorusGeometry(r * 0.55, 1.6, 6, 30, Math.PI * 1.3), mat); sw.rotation.x = Math.PI / 2; sw.position.y = 2;
        g.add(ring, disc, sw); g.position.set(X(x), 0, y);
        levelGroup.add(g);
        return { g, sw };
      };
      levelObjs.portals.push({ p, a: mk(p.ix, p.iy, p.r, '#b06bff'), b: mk(p.ex, p.ey, p.r * 0.8, '#38cfff') });
    }
  });
  scene.add(levelGroup);
}

/* cup / tray */
const matCache = new Map();
function materialFor(l) {
  const t = tierOf(l);
  if (matCache.has(t)) return matCache.get(t);
  const m = MATS[t];
  const mat = new T.MeshStandardMaterial({ color: m.color, metalness: m.metal, roughness: m.rough, map: m.wood ? DARK : null, emissive: m.glow ? m.color : 0x000000, emissiveIntensity: m.glow || 0, transparent: !!m.opacity, opacity: m.opacity || 1 });
  if (m.wood) mat.color.set('#ffd2a8');
  matCache.set(t, mat);
  return mat;
}
let tray = null, trayBuilt = '', pourer = null, pourBuilt = -1, magnetFx = null;
function rebuildTray() {
  const c = G.cup, lw = up('width');
  const key = c.w + '|' + tierOf(lw) + '|' + up('magnet');
  if (tray && trayBuilt === key) return;
  if (tray) { scene.remove(tray); tray.traverse(o => o.geometry && o.geometry.dispose()); }
  trayBuilt = key;
  const mat = materialFor(lw), w = c.w, hgt = 30, th = 7;
  tray = new T.Group();
  const floor = box(w - 10, 3, CUP_H, mat, 1); floor.position.set(0, 1.5, CUP_H / 2);
  const back = box(w - 14 + th, hgt, th, mat, 2.5); back.position.set(0, hgt / 2, CUP_H + th / 2 - 2);
  const ang = Math.atan2(7, CUP_H);
  const side = l => { const m = box(th, hgt, Math.hypot(7, CUP_H) + th, mat, 2.5); m.position.set(l * (w / 2 - 3.5), hgt / 2, CUP_H / 2); m.rotation.y = -l * ang; return m; };
  const lip = box(w + 6, 5, 5, mat, 2); lip.position.set(0, hgt + 1, CUP_H + th / 2 - 2);
  tray.add(floor, back, side(-1), side(1), lip);
  if (up('magnet')) {
    const mm = new T.MeshStandardMaterial({ color: 0xff3b4e, roughness: .3, metalness: .2 });
    const arc = new T.Mesh(new T.TorusGeometry(7, 3, 10, 24, Math.PI), mm); arc.rotation.z = Math.PI; arc.position.set(0, hgt * 0.5, CUP_H + th + 0.5);
    const tipM = new T.MeshStandardMaterial({ color: 0xeef2ff, roughness: .2, metalness: .8 });
    const t1 = new T.Mesh(new T.BoxGeometry(6, 6, 6), tipM); t1.position.set(-7, hgt * 0.5 + 3, CUP_H + th + 0.5);
    const t2 = t1.clone(); t2.position.x = 7;
    tray.add(arc, t1, t2);
    // pull field rings in front of the cup
    magnetFx = [];
    for (let i = 0; i < 3; i++) {
      const rm = new T.MeshBasicMaterial({ color: 0x9ff3ff, transparent: true, opacity: 0, depthWrite: false, side: T.DoubleSide });
      const ring = new T.Mesh(new T.RingGeometry(0.94, 1, 64, 1, Math.PI, Math.PI), rm);
      ring.rotation.x = -Math.PI / 2; ring.position.y = 1.2;
      tray.add(ring); magnetFx.push(ring);
    }
  } else magnetFx = null;
  tray.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(tray);
}
