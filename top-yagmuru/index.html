/* camera framing: search the closest camera that fits the whole stage under the HUD */
const CAM = { D: 1000, zc: SH / 2, pitch: 1.0, dir: new T.Vector3() };
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 0.7 ? 46 : 40;
  camera.updateProjectionMatrix();
  CAM.pitch = 1.02;
  CAM.dir.set(0, Math.sin(CAM.pitch), Math.cos(CAM.pitch));
  const topLim = 1 - 2 * ((G.demo || G.state === 'menu' ? 60 : 150) / h), botLim = -1 + 2 * (24 / h);
  const pts = [[-W / 2 - 18, -10], [W / 2 + 18, -10], [-W / 2 - 18, SH + 10], [W / 2 + 18, SH + 10]];
  const v = new T.Vector3();
  for (let D = 400; D < 5000; D += 15) {
    for (let zc = SH * 0.38; zc <= SH * 0.62; zc += 8) {
      camera.position.set(0, 0, zc).addScaledVector(CAM.dir, D);
      camera.lookAt(0, 0, zc); camera.updateMatrixWorld();
      let ok = true;
      for (const [px, pz] of pts) { v.set(px, 0, pz).project(camera); if (v.x < -1 || v.x > 1 || v.y > topLim || v.y < botLim) { ok = false; break; } }
      if (ok) { CAM.D = D; CAM.zc = zc; return; }
    }
  }
}
window.addEventListener('resize', fitCamera);

/* world → screen */
const pv = new T.Vector3();
function toScreen(x, hgt, y) {
  pv.set(X(x), hgt, y).project(camera);
  return { x: (pv.x + 1) / 2 * window.innerWidth, y: (1 - pv.y) / 2 * window.innerHeight };
}

/* DOM labels */
const LBL = {};
function lbl(id, cls) {
  if (!LBL[id]) { const e = document.createElement('div'); e.className = 'lbl ' + (cls || ''); $('labels').appendChild(e); LBL[id] = { e, text: null }; }
  return LBL[id];
}
function setLbl(id, text, x, hgt, y, cls) {
  const L = lbl(id, cls);
  if (text == null) { L.e.hidden = true; return; }
  L.e.hidden = false;
  if (L.text !== text) { L.e.textContent = text; L.text = text; }
  const s = toScreen(x, hgt, y);
  L.e.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -50%)`;
}
let popCount = 0;
function popText(x, y, text, cls) {
  if (popCount > 14) return;
  const s = toScreen(x, 14, y);
  const e = document.createElement('div');
  e.className = 'pop ' + (cls || '');
  e.textContent = text;
  e.style.left = s.x + 'px'; e.style.top = s.y + 'px';
  $('pops').appendChild(e); popCount++;
  setTimeout(() => { e.remove(); popCount--; }, 900);
}
function praise(text, big) {
  const e = document.createElement('div');
  e.className = 'praise' + (big ? ' big' : '');
  e.textContent = text;
  $('pops').appendChild(e);
  setTimeout(() => e.remove(), 1450);
}

/* per-frame 3D sync */
const M4 = new T.Matrix4(), Q = new T.Quaternion(), QD = new T.Quaternion(), V3 = new T.Vector3(), S3 = new T.Vector3(), AX = new T.Vector3(), EU = new T.Euler(), COLR = new T.Color();
const SLOT_Q = Array.from({ length: 400 }, () => new T.Quaternion().setFromEuler(new T.Euler(rand(0, 6), rand(0, 6), rand(0, 6))));
let lastRender = performance.now();
function render3D() {
  const now = performance.now(), dt = Math.min(0.05, (now - lastRender) / 1000);
  lastRender = now;
  if (!G.L) { renderer.render(scene, camera); return; }

  // camera
  const zc = G.cam + CAM.zc;
  const sx = G.shake ? rand(-G.shake, G.shake) : 0, sy = G.shake ? rand(-G.shake, G.shake) : 0;
  camera.position.set(sx, sy, zc).addScaledVector(CAM.dir, CAM.D);
  camera.lookAt(sx * 0.5, 0, zc);
  camera.updateMatrixWorld();
  sun.position.set(-220, 760, zc + 260); sun.target.position.set(0, 0, zc); sun.target.updateMatrixWorld();

  // gates
  for (const o of levelObjs.gates) {
    const g = o.g;
    o.grp.visible = !g.dead;
    if (g.dead) continue;
    o.grp.position.x = X(g.x + g.w / 2);
    const s = 1 + g.flash * 0.08;
    o.grp.scale.set(s, 1 + g.flash * 0.5, s);
    o.mat.emissiveIntensity = 0.3 + g.flash * 0.8;
    if (g.dirty && (!g.dirtyT || G.t - g.dirtyT > 0.12)) {
      g.dirty = false; g.dirtyT = G.t;
      o.lm.map.dispose(); o.lm.map = gateLabel(g); o.lm.needsUpdate = true;
    }
    if (g.uses !== Infinity) setLbl('use' + g.id, String(g.uses), g.x + g.w / 2, 4, g.y + g.h / 2 + 12, 'tag');
  }
  for (const o of levelObjs.circles) {
    const f = o.o.flash;
    if (o.o.kind === 'bumper') { const s = 1 + f * 0.25; o.m.scale.set(s, 1 - f * 0.2, s); }
    else o.m.scale.y = 1 - f * 0.15;
  }
  for (const o of levelObjs.spinners) o.m.rotation.y = -o.sp.a;
  for (const o of levelObjs.portals) { o.a.sw.rotation.z = G.t * 4; o.b.sw.rotation.z = -G.t * 4; const s = 1 + (o.p.flash || 0) * 0.25; o.a.g.scale.set(s, 1, s); }

  // items
  let n = 0, ng = 0;
  const cols = PALETTE.cols;
  for (const b of G.balls) {
    if (b.vh || b.hz > 0) { b.vh -= 900 * dt; b.hz += b.vh * dt; if (b.hz <= 0) { b.hz = 0; b.vh = Math.abs(b.vh) > 60 ? -b.vh * 0.35 : 0; } }
    if (!b.q) b.q = new T.Quaternion().setFromEuler(EU.set(rand(0, 6), rand(0, 6), rand(0, 6)));
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 1) { AX.set(b.vy / sp, 0, -b.vx / sp); QD.setFromAxisAngle(AX, sp * dt / b.r); b.q.premultiply(QD); }
    V3.set(X(b.x), b.r * 1.5 + b.hz, b.y); S3.setScalar(b.r * 1.5);
    M4.compose(V3, b.q, S3);
    if (b.gold) { if (ng < CAP) goldMesh.setMatrixAt(ng++, M4); }
    else if (n < MAX_ITEMS) { itemMesh.setMatrixAt(n, M4); itemMesh.setColorAt(n, cols[b.c % cols.length]); n++; }
  }

  // cup / tray
  const showCup = G.state !== 'transition' && G.cup;
  tray.visible = !!showCup;
  if (showCup) {
    const c = G.cup, s = 1 + c.bump * 0.06;
    tray.position.set(X(c.x), 0, c.y);
    tray.scale.set(s, 1 / s, 1);
    // fill: items heaped inside
    const target = c.final ? G.L.target : 160;
    const frac = c.count <= 0 ? 0 : c.final ? Math.min(1, c.count / (target * 1.2)) : 1 - Math.exp(-c.count / target);
    const colsN = Math.max(3, Math.floor((c.w - 18) / 11)), rows = 4, layers = 3, capN = colsN * rows * layers;
    const show = Math.min(capN, Math.round(frac * capN), 300);
    for (let i = 0; i < show && n < MAX_ITEMS; i++) {
      const layer = Math.floor(i / (colsN * rows)), k = i % (colsN * rows), cx = k % colsN, rz = Math.floor(k / colsN);
      V3.set(X(c.x) + (cx - (colsN - 1) / 2) * 11 + (layer % 2) * 3, 8 + layer * 8, c.y + 14 + rz * 11 + (layer % 2) * 3);
      S3.setScalar(6); M4.compose(V3, SLOT_Q[i % SLOT_Q.length], S3);
      itemMesh.setMatrixAt(n, M4); itemMesh.setColorAt(n, cols[i % cols.length]); n++;
    }
    if (magnetFx) magnetFx.forEach((ring, i) => {
      const k = 1 - ((G.t * 0.7 + i / 3) % 1), R = c.w / 2 + (fx('magnet') - c.w / 2) * k;
      ring.scale.set(R / s, R * 0.9, 1); ring.position.z = 2;
      ring.material.opacity = (1 - k) * 0.55;
    });
    const met = c.final && c.count >= G.L.target;
    setLbl('cup', c.final ? `${fmt(c.count)}/${fmt(G.L.target)}` : fmt(c.count), c.x, 44, c.y + CUP_H + 4, 'cup' + (met ? ' met' : ''));
  } else setLbl('cup', null);

  // pourer
  rebuildPourer();
  let px, py, tilt, remaining, total;
  if (G.state === 'transition') {
    const tr = G.trans, e = ease(clamp(tr.t, 0, 1));
    px = tr.x; py = tr.cupFrom + (tr.cupTo - tr.cupFrom) * e; tilt = 0; remaining = total = tr.count;
  } else if (G.pour) {
    const p = G.pour; px = p.x; py = p.y; tilt = p.tilt; remaining = p.supply - p.emittedV; total = p.supply;
  }
  if (px !== undefined) {
    pourer.visible = true;
    pourer.position.set(X(px), 46, py);
    pourer.rotation.set(tilt * 0.55, 0, -tilt * 1.95);
    const frac = total ? remaining / total : 0, show = Math.round(frac * 14);
    for (let i = 0; i < show && n < MAX_ITEMS; i++) {
      const a = i * 2.4, rr = i < 6 ? 9 : 4;
      V3.set(Math.cos(a) * rr, -12 + Math.floor(i / 6) * 9, Math.sin(a) * rr);
      V3.applyEuler(pourer.rotation).add(pourer.position);
      S3.setScalar(5.2); M4.compose(V3, SLOT_Q[i], S3);
      itemMesh.setMatrixAt(n, M4); itemMesh.setColorAt(n, cols[i % cols.length]); n++;
    }
    setLbl('pour', remaining > 0 && !G.demo ? fmt(remaining) : null, px, 95, py);
  } else { pourer.visible = false; setLbl('pour', null); }

  itemMesh.count = n; goldMesh.count = ng;
  itemMesh.instanceMatrix.needsUpdate = true;
  if (itemMesh.instanceColor) itemMesh.instanceColor.needsUpdate = true;
  goldMesh.instanceMatrix.needsUpdate = true;

  // particles
  let np = 0;
  for (const p of G.parts) {
    if (np >= 700) break;
    V3.set(X(p.x), p.h + 1, p.y);
    Q.setFromEuler(EU.set(p.rot, p.rot * 0.7, p.rot * 0.3));
    const a = clamp(p.life * 2, 0, 1);
    S3.set(p.s * 1.6 * a, p.s * a * (p.conf ? 0.4 : 1.6), p.s * a);
    M4.compose(V3, Q, S3);
    partMesh.setMatrixAt(np, M4); partMesh.setColorAt(np, COLR.set(p.col)); np++;
  }
  partMesh.count = np;
  partMesh.instanceMatrix.needsUpdate = true;
  if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;

  // stage tags are painted; clean labels of other stages' gates
  for (const id in LBL) if (id.startsWith('use')) { const g = levelObjs.gates.find(o => 'use' + o.g.id === id); if (!g || g.g.dead || g.g.y < G.st.y0 || g.g.y > G.st.y0 + SH) LBL[id].e.hidden = true; }

  renderer.render(scene, camera);
}

/* ---------- HUD ---------- */
let hudCache = '';
const STAR_PATH = 'M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';
function buildDots() {
  const d = $('hudDots'); d.innerHTML = '';
  G.L.stages.forEach(() => d.appendChild(document.createElement('i')));
}
function buildMarks() {
  $('goalMarks').innerHTML = [1, 1.6, 2.5].map(m => `<svg viewBox="0 0 24 24" style="left:${m / 2.5 * 100}%"><path d="${STAR_PATH}"/></svg>`).join('');
}
function updateHud(force) {
  if (!G.L) return;
  const inGame = !G.demo && G.state !== 'menu';
  $('hud').hidden = !inGame; $('goal').hidden = !inGame;
  if (!inGame) return;
  const c = G.cup, final = G.st && G.st.final;
  const key = [G.L.n, G.si, G.state, c && c.count, save.coins, G.gold].join('|');
  if (!force && key === hudCache) return;
  hudCache = key;
  $('hudLevel').textContent = 'Seviye ' + G.L.n;
  [...$('hudDots').children].forEach((el, i) => { el.className = i < G.si || (i === G.si && G.state === 'transition') ? 'done' : i === G.si ? 'on' : ''; });
  $('hudCoins').textContent = fmt(save.coins + (G.state === 'result' ? 0 : G.gold));
  const n = c ? c.count : 0, tgt = G.L.target;
  $('goalNum').textContent = fmt(n);
  $('goalOf').textContent = final ? ' / ' + fmt(tgt) : '';
  $('goalSub').textContent = final ? 'FİNAL · HEDEFİ GEÇ' : `AŞAMA ${G.si + 1}/${G.L.stages.length}`;
  $('goalBarWrap').hidden = !final;
  if (final) {
    $('goalFill').style.width = Math.min(100, n / (tgt * 2.5) * 100) + '%';
    [...$('goalMarks').children].forEach((el, i) => el.classList.toggle('lit', n >= tgt * [1, 1.6, 2.5][i]));
  }
}
let toastT = 0;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.remove('gone');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('gone'), 2200);
}

/* ---------- screens ---------- */
const SCREENS = ['scrMenu', 'scrShop', 'scrSettings', 'scrResult'];
let shopReturn = 'scrMenu', resultTimer = 0;
function show(id) {
  SCREENS.forEach(s => { $(s).hidden = s !== id; });
  if (id === 'scrMenu') refreshMenu();
  if (id === 'scrShop') refreshShop();
  if (id === 'scrSettings') refreshSettings();
  if (id !== null) $('hint').hidden = true;
  updateHud(true);
  const btn = id && $(id).querySelector('.btn');
  if (btn) setTimeout(() => btn.focus({ preventScroll: true }), 30);
}
function refreshMenu() {
  $('menuStars').textContent = Object.values(save.stars).reduce((a, b) => a + b, 0);
  $('menuCoins').textContent = fmt(save.coins);
  $('menuSub').textContent = `Seviye ${save.level} · ${themeFor(save.level).name}`;
}
function startDemo() {
  startLevel(save.level, true);
  G.state = 'play';
  fitCamera();
}
function goMenu() {
  show('scrMenu');
  startDemo();
}
function refreshShop(justBought) {
  $('shopCoins').textContent = fmt(save.coins);
  const list = $('shopList');
  const scroll = list.scrollTop;
  list.innerHTML = '';
  for (const u of UPGRADES) {
    const l = up(u.id), maxed = l >= MAXL, cost = upCost(u, l);
    const now = FX[u.id](l), next = FX[u.id](Math.min(MAXL, l + 1));
    const el = document.createElement('div');
    el.className = 'up' + (justBought === u.id ? ' bought' : '');
    let eff = maxed ? `<b>${u.show(now)}</b> · en üst seviye` : `${u.show(now)} → <b>${u.show(next)}</b>`;
    if (u.extra) {
      const nextTierLvl = Math.floor(l / 5) * 5 + 5;
      eff += `<br>${u.extra(l)}` + (!maxed && nextTierLvl <= MAXL && tierOf(nextTierLvl) !== tierOf(l) ? ` · Sv ${nextTierLvl}: ${matFor(nextTierLvl).name}` : '');
    }
    el.innerHTML = `<div class="ic">${ICONS[u.id]}</div>
      <h3><span></span><small>Sv ${l}/${MAXL}</small></h3>
      <div class="eff">${eff}</div>
      <div class="lvbar"><span style="width:${l / MAXL * 100}%"></span></div>
      <button class="buy" id="buy-${u.id}" ${maxed || save.coins < cost ? 'disabled' : ''}>${maxed ? 'TAMAM' : `<i class="coin sm"></i>${fmt(cost)}`}</button>`;
    el.querySelector('h3 span').textContent = u.name;
    el.querySelector('button').addEventListener('click', () => {
      if (maxed || save.coins < cost) return;
      save.coins -= cost; save.up[u.id] = l + 1; persist();
      tone(660, 0.08, 'triangle', 0.05, 1.5); setTimeout(() => tone(990, 0.1, 'triangle', 0.05), 70);
      if (u.extra && tierOf(l + 1) !== tierOf(l)) toast(`Yeni malzeme: ${matFor(l + 1).name}!`);
      if (G.cup && G.L && G.st) { G.cup.w = G.st.cup.w + fx('width'); rebuildTray(); }
      refreshShop(u.id); updateHud(true); refreshMenu();
    });
    list.appendChild(el);
  }
  list.scrollTop = scroll;
}
function refreshSettings() {
  $('tSound').setAttribute('aria-checked', String(save.sound));
  $('tHaptic').setAttribute('aria-checked', String(save.haptic));
  const inGame = !G.demo && (G.state === 'play' || G.state === 'transition');
  $('setTitle').textContent = inGame ? 'Duraklatıldı' : 'Ayarlar';
  $('btnResume').textContent = inGame ? 'Devam et' : 'Kapat';
  $('btnRestart').hidden = !inGame;
  $('btnHome').hidden = !inGame;
  const r = $('btnReset'); r.textContent = 'İlerlemeyi sıfırla'; r.dataset.armed = '';
}

function play(n) { ac(); startLevel(n); fitCamera(); }
$('btnPlay').addEventListener('click', () => play(save.level));
$('btnShop').addEventListener('click', () => { shopReturn = 'scrMenu'; show('scrShop'); });
$('btnResShop').addEventListener('click', () => { shopReturn = 'scrResult'; show('scrShop'); });
$('btnShopBack').addEventListener('click', () => show(shopReturn));
$('btnSettings').addEventListener('click', () => show('scrSettings'));
$('btnPause').addEventListener('click', () => {
  if (G.state === 'play' || G.state === 'transition') { G.paused = true; G.input.hold = false; }
  show('scrSettings');
});
$('btnResume').addEventListener('click', () => {
  if (G.demo) show('scrMenu');
  else if (G.state === 'play' || G.state === 'transition') { G.paused = false; show(null); }
  else if (G.state === 'result') show('scrResult');
  else show('scrMenu');
});
$('btnRestart').addEventListener('click', () => play(G.L.n));
$('btnHome').addEventListener('click', goMenu);
$('btnNext').addEventListener('click', e => play(e.currentTarget.dataset.act === 'next' ? G.L.n + 1 : G.L.n));
$('btnRetry').addEventListener('click', () => play(G.L.n));
$('tSound').addEventListener('click', () => { save.sound = !save.sound; persist(); refreshSettings(); if (save.sound) tone(660, 0.08); });
$('tHaptic').addEventListener('click', () => { save.haptic = !save.haptic; persist(); refreshSettings(); buzz(15); });
$('btnReset').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Emin misin? Tekrar dokun'; return; }
  const keep = { sound: save.sound, haptic: save.haptic };
  save = Object.assign(DEFAULT_SAVE(), keep); persist();
  b.dataset.armed = ''; b.textContent = 'İlerleme sıfırlandı';
  refreshMenu(); updateHud(true);
});

/* ---------- input ---------- */
const ray = new T.Raycaster(), plane = new T.Plane(new T.Vector3(0, 1, 0), 0), ndc = new T.Vector2(), hit = new T.Vector3();
function worldX(e) {
  const r = cv.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hit)) return G.input.x + 18;
  return hit.x + W / 2;
}
let activePointer = null;
const canPlay = () => G.state === 'play' && !G.paused && !G.demo;
cv.addEventListener('pointerdown', e => {
  if (!canPlay()) return;
  activePointer = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  ac();
  G.input.hold = true;
  G.input.x = clamp(worldX(e) - 18, 26, W - 26);
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!canPlay()) return;
  if (activePointer !== e.pointerId && e.pointerType !== 'mouse') return;
  if (e.pointerType === 'mouse' || G.input.hold) G.input.x = clamp(worldX(e) - 18, 26, W - 26);
});
const release = e => { if (activePointer === e.pointerId) { activePointer = null; if (!G.demo) G.input.hold = false; } };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => {
  if (!canPlay()) {
    if (e.key === 'Escape' && !$('scrSettings').hidden) $('btnResume').click();
    return;
  }
  if (e.code === 'Space') { G.input.hold = true; e.preventDefault(); ac(); }
  if (e.key === 'ArrowLeft') G.input.keyL = true;
  if (e.key === 'ArrowRight') G.input.keyR = true;
  if (e.key === 'Escape' || e.key === 'p') $('btnPause').click();
});
window.addEventListener('keyup', e => {
  if (G.demo) return;
  if (e.code === 'Space') G.input.hold = false;
  if (e.key === 'ArrowLeft') G.input.keyL = false;
  if (e.key === 'ArrowRight') G.input.keyR = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !G.demo && (G.state === 'play' || G.state === 'transition') && !G.paused) $('btnPause').click();
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  render3D();
  requestAnimationFrame(frame);
}

function boot() {
  fitCamera();
  goMenu();
  requestAnimationFrame(frame);
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load(`700 40px ${FD}`) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).catch(() => {}).then(boot);

// test hook
window.__topYagmuru = { G, update, genLevel, startLevel, save: () => save, render3D };
})();
</script>
